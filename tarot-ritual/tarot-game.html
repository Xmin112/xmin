<style>:root{--bg:#050508;--red:#c0392b;--dred:#8b0000;--bone:#e8e0d5;--gray:#6b6b6b;--gold:#c9a96e;--panel:rgba(14,14,20,.92)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:'JetBrains Mono',monospace;color:var(--bone);width:100vw;height:100vh;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;z-index:0}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}#ui>*{pointer-events:auto}
/* Header */
#hdr{position:fixed;top:0;left:0;right:0;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;z-index:30;background:linear-gradient(180deg,rgba(5,5,8,.98) 0%,transparent 100%)}
#hdr .title{font-size:16px;font-weight:700;letter-spacing:.5em;background:linear-gradient(135deg,var(--bone) 0%,var(--gold) 40%,var(--red) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
#hdr .ver{font-size:7px;color:var(--gray);letter-spacing:.25em}
/* Stats panel */
#stats{position:fixed;right:16px;top:70px;z-index:30;display:flex;flex-direction:column;gap:3px}
#stats .row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:5px 10px;background:var(--panel);border:1px solid rgba(255,255,255,.04);backdrop-filter:blur(16px);font-size:7px;cursor:pointer;transition:border-color .3s}
#stats .row:hover{border-color:rgba(192,57,43,.2)}
#stats .row .lbl{color:var(--gray);letter-spacing:.15em;text-transform:uppercase}
#stats .row .val{color:var(--bone);font-weight:500}
#stats .row .val.on{color:var(--red)}
/* Gesture bar */
#gbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;padding:7px 18px;background:var(--panel);border:1px solid rgba(255,255,255,.04);backdrop-filter:blur(16px)}
#gbar .dot{width:7px;height:7px;border-radius:50%;background:#222;transition:all .3s;flex-shrink:0}
#gbar .dot.a{background:var(--red);box-shadow:0 0 12px rgba(192,57,43,.7)}
#gbar .lbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);transition:color .3s}
#gbar .lbl.a{color:var(--bone)}
/* Mode toggle */
#tgl{position:fixed;top:70px;right:16px;background:var(--panel);border:1px solid rgba(255,255,255,.06);color:var(--gray);padding:6px 14px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.2em;text-transform:uppercase;z-index:30;backdrop-filter:blur(16px);transition:all .3s}
#tgl:hover{border-color:rgba(192,57,43,.4);color:var(--red)}
/* Card info tooltip */
#tip{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 20px;background:var(--panel);border:1px solid rgba(192,57,43,.2);backdrop-filter:blur(16px);text-align:center;display:none}
#tip .nm{font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--bone)}
#tip .en{font-size:8px;color:var(--gray);letter-spacing:.1em;margin-top:2px}
#tip .tags{font-size:7px;color:var(--red);letter-spacing:.1em;margin-top:4px}
/* History */
#hist{position:fixed;right:12px;top:160px;width:170px;max-height:45vh;overflow-y:auto;z-index:30;display:flex;flex-direction:column;gap:3px}
#hist .e{background:var(--panel);border-left:3px solid var(--dred);padding:6px 8px;font-size:7px;backdrop-filter:blur(8px)}
#hist .e.up{border-left-color:var(--gold)}
#hist .e .n{color:var(--bone);font-weight:600;text-transform:uppercase}
#hist .e .t{color:var(--gray);margin-top:2px;line-height:1.4}
/* Result card display */
#result{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;display:none;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
#result .rname{font-size:20px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--bone)}
#result .rform{font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:3px 10px;border:1px solid}
#result .rform.up{color:var(--gold);border-color:rgba(201,169,110,.4)}
#result .rform.rev{color:var(--red);border-color:rgba(192,57,43,.5)}
#result .rdesc{font-size:10px;color:var(--gray);text-align:center;max-width:280px;line-height:1.7}
/* Cursor */
#cur{position:fixed;width:24px;height:24px;pointer-events:none;z-index:100;transform:translate(-50%,-50%);display:none}
/* Error */
#err{position:fixed;bottom:0;left:0;right:0;background:rgba(100,0,0,.92);color:#f66;padding:6px 12px;font-size:8px;z-index:999;display:none;cursor:pointer;font-family:monospace}

<script type="module">
import * as THREE from 'three'
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js'
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js'
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js'

// ═══════════════ DATA ═══════════════
const CARDS=[{id:0,en:'The Fool',cn:'愚者',tags:'开始·冒险',up:'新的旅程，纯真无畏地迈向未知',rev:'鲁莽冒险，不计后果的冲动'},
{id:1,en:'The Magician',cn:'魔术师',tags:'创造·意志',up:'创造力与技能，将想法变为现实',rev:'操控与欺骗，浪费天赋才能'},

{id:6,en:'The Lovers',cn:'恋人',tags:'爱情·选择',up:'遵从内心做出重要抉择',rev:'价值观冲突，做出错误选择'},

{id:12,en:'The Hanged Man',cn:'倒吊人',tags:'牺牲·视角',up:'暂停与放手，获得全新的领悟',rev:'拖延与抗拒，陷入自我牺牲'},
{id:13,en:'Death',cn:'死神',tags:'终结·重生',up:'旧事物终结，新生的开始',rev:'抗拒改变，陷入停滞'},
{id:14,en:'Temperance',cn:'节制',tags:'平衡·耐心',up:'保持平衡与耐心，找到生活节奏',rev:'失衡状态，过度或缺乏'},
{id:15,en:'The Devil',cn:'恶魔',tags:'束缚·欲望',up:'认识束缚是解放自己的第一步',rev:'否认束缚存在，被欲望控制'},

{id:17,en:'The Star',cn:'星星',tags:'希望·治愈',up:'暴风雨已过，希望之光照亮夜空',rev:'绝望与失信，看不到未来'},
{id:18,en:'The Moon',cn:'月亮',tags:'幻象·直觉',up:'月光下的幻象，用直觉穿越迷雾',rev:'被假象蒙蔽，沉溺非理性恐惧'},
{id:19,en:'The Sun',cn:'太阳',tags:'快乐·成功',up:'温暖与快乐，尽情享受光明时光',rev:'暂时的挫折，过度乐观'},
{id:20,en:'Judgement',cn:'审判',tags:'觉醒·召唤',up:'觉醒与重生，接受更高的使命',rev:'拒绝反思过去，对召唤充耳不闻'},
{id:21,en:'The World',cn:'世界',tags:'完成·圆满',up:'一个周期圆满完成，庆祝成就',rev:'未完成的感觉，循环无法闭合'}]

// ═══════════════ STATE ═══════════════
const S={phase:'idle',deck:[...CARDS],drawn:[],hovered:null,grabbed:null,current:null,orient:null,drawCount:0}
let mode='camera',gesture='none',cursor={x:.5,y:.5},handOn=false,gestureTimer=0,prevGesture='none'

// ═══════════════ THREE.JS ═══════════════
const W=innerWidth,H=innerHeight
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false})
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H);renderer.toneMapping=THREE.ReinhardToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement)

const scene=new THREE.Scene();scene.background=new THREE.Color(0x050508);scene.fog=new THREE.FogExp2(0x050508,.0008)
const cam=new THREE.PerspectiveCamera(50,W/H,.1,40);cam.position.set(0,.4,6.5);cam.lookAt(0,-.1,0)

// Lighting
scene.add(new THREE.AmbientLight(0x1a1a2e,.5))
const key=new THREE.DirectionalLight(0xe8e0d5,1.5);key.position.set(4,6,5);key.castShadow=true;scene.add(key)
const rim=new THREE.DirectionalLight(0x8b0000,.5);rim.position.set(-3,-2,-4);scene.add(rim)
const top=new THREE.PointLight(0xc0392b,.4,12);top.position.set(0,3,0);scene.add(top)

// Stars
const sg=new THREE.BufferGeometry();const sp=new Float32Array(800*3);const sc=new Float32Array(800*3)
for(let i=0;i<800;i++){const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=10+Math.random()*8;sp[i*3]=r*Math.sin(p)*Math.cos(t);sp[i*3+1]=r*Math.sin(p)*Math.sin(t);sp[i*3+2]=r*Math.cos(p);const isRed=Math.random()>.88;sc[i*3]=isRed?.8:.2+Math.random()*.5;sc[i*3+1]=isRed?.05:.2+Math.random()*.4;sc[i*3+2]=isRed?.05:.2+Math.random()*.4}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3))
const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.04,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7}))
scene.add(stars)

// Floor grid
const grid=new THREE.GridHelper(10,30,0x331111,0x111118);grid.position.y=-3;grid.material.opacity=.12;grid.material.transparent=true;scene.add(grid)

// Bloom
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,cam))
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.6,.4,.85);bloom.threshold=.15;bloom.strength=.6;bloom.radius=.5;composer.addPass(bloom)

// ═══════════════ CARD SYSTEM ═══════════════
const CW=.7,CH=1.12,loader=new THREE.TextureLoader()
const backTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=400;const x=c.getContext('2d');x.fillStyle='#0a0a10';x.fillRect(0,0,256,400);x.strokeStyle='rgba(192,57,43,.28)';x.lineWidth=2;x.strokeRect(8,8,240,384);x.strokeStyle='rgba(192,57,43,.12)';x.lineWidth=1;x.strokeRect(18,18,220,364);x.beginPath();x.moveTo(128,26);x.lineTo(225,200);x.lineTo(31,200);x.closePath();x.strokeStyle='rgba(192,57,43,.4)';x.stroke();x.beginPath();x.moveTo(128,170);x.lineTo(188,62);x.lineTo(68,62);x.closePath();x.strokeStyle='rgba(192,57,43,.15)';x.stroke();x.fillStyle='rgba(192,57,43,.55)';x.beginPath();x.arc(128,128,4,0,Math.PI*2);x.fill();x.font='bold 16px "JetBrains Mono",monospace';x.fillStyle='#c0392b';x.textAlign='center';x.fillText('CLASSIFIED',128,270);x.font='8px "JetBrains Mono",monospace';x.fillStyle='rgba(107,107,107,.55)';x.fillText('FBC · PARANATURAL DIVISION',128,290);for(let y=20;y<385;y+=14){x.fillStyle=`rgba(139,0,0,${.025+Math.random()*.01})`;x.fillRect(12,y,6,1.5);x.fillRect(238,y,6,1.5)}return new THREE.CanvasTexture(c)})()

let cards=[],texCache={}
function getTex(id){if(!texCache[id])texCache[id]=loader.load(`/cards/major_${String(id).padStart(2,'0')}.png`);return texCache[id]}

function makeCard(data){
  const g=new THREE.PlaneGeometry(CW,CH)
  const f=new THREE.MeshStandardMaterial({map:getTex(data.id),roughness:.45,metalness:.05,emissive:new THREE.Color(0x110000),emissiveIntensity:.15})
  const b=new THREE.MeshStandardMaterial({map:backTex,roughness:.35,metalness:.2,emissive:new THREE.Color(0x110000),emissiveIntensity:.1})
  const m=new THREE.Mesh(g,f);m.castShadow=true;m.receiveShadow=true
  m.userData={card:data,front:f,back:b,flipped:false,basePos:new THREE.Vector3,baseRot:new THREE.Euler,angle:0,grabbed:false,hovered:false,targetY:0}
  return m
}

function buildSpread(){
  cards.forEach(m=>{scene.remove(m);m.geometry.dispose();m.userData.front.dispose();m.userData.back.dispose()});cards=[]
  const n=S.deck.length,R=3.5,A=Math.PI*.65
  for(let i=0;i<n;i++){
    const m=makeCard(S.deck[i]),a=-A/2+(i/Math.max(n-1,1))*A
    m.position.set(Math.sin(a)*R,(i%3)*.04-.15,Math.cos(a)*R-.8)
    m.rotation.set(-.18,-a,(Math.random()-.5)*.06)
    m.userData.basePos.copy(m.position);m.userData.baseRot.copy(m.rotation);m.userData.angle=a
    scene.add(m);cards.push(m)
  }
}

// ═══════════════ PARTICLES ═══════════════
const ashGeo=new THREE.BufferGeometry();const ashPosArr=new Float32Array(300*3);const ashSizeArr=new Float32Array(300)
ashGeo.setAttribute('position',new THREE.BufferAttribute(ashPosArr,3));ashGeo.setAttribute('size',new THREE.BufferAttribute(ashSizeArr,1))
const ashSys=new THREE.Points(ashGeo,new THREE.PointsMaterial({size:.05,color:0xff3333,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}))
ashSys.visible=false;scene.add(ashSys)
let particles=[]

function spawnAsh(pos,orient){
  for(let i=0;i<200;i++)particles.push({x:pos.x,y:pos.y,z:pos.z,vx:(Math.random()-.5)*.08,vy:Math.random()*.07+.02,vz:(Math.random()-.5)*.06,life:1,sz:.02+Math.random()*.06,red:orient==='reversed'&&Math.random()>.35})
  ashSys.visible=true
}

// ═══════════════ RAYCASTER ═══════════════
const raycaster=new THREE.Raycaster()
function raycast(x,y){
  raycaster.setFromCamera(new THREE.Vector2(x*2-1,-y*2+1),cam)
  cards.forEach(m=>{m.userData.hovered=false;m.material=m.userData.back;m.material.emissiveIntensity=.1})
  const hits=raycaster.intersectObjects(cards.filter(m=>!m.userData.grabbed))
  const tip=document.getElementById('tip');const res=document.getElementById('result')
  if(hits.length>0&&!S.grabbed){
    const m=hits[0].object;m.userData.hovered=true;m.material=m.userData.front;m.material.emissiveIntensity=.35
    S.hovered=m.userData.card
    if(S.phase!=='ash'){tip.querySelector('.nm').textContent=m.userData.card.cn;tip.querySelector('.en').textContent=m.userData.card.en;tip.querySelector('.tags').textContent=m.userData.card.tags;tip.style.display='block'}
  }else{if(S.phase!=='ash'){S.hovered=null;tip.style.display='none'}}
}

// ═══════════════ GESTURES ═══════════════
let hands=null,camInst=null
const vid=document.createElement('video');vid.autoplay=true;vid.playsInline=true;vid.muted=true;vid.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(vid)

async function startCamera(){
  try{window.Module=window.Module||{};const V='0.4.1675469240';const m=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/hands@${V}/+esm`);const c=await import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/+esm');hands=new m.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@${V}/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.5,minTrackingConfidence:.4});hands.onResults(r=>{if(r.multiHandLandmarks?.length>0){handOn=true;const lm=r.multiHandLandmarks[0];if(lm[8])cursor={x:1-lm[8].x,y:lm[8].y};const tips=[4,8,12,16,20],mcps=[2,5,9,13,17];let ext=0;tips.forEach((t,i)=>{if(lm[t]&&lm[mcps[i]])ext+=i===0?Math.abs(lm[t].x-lm[mcps[i]].x)>.05?1:0:lm[t].y<lm[mcps[i]].y?1:0});const d=lm[4]&&lm[8]?Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y):1;if(ext<=1)gesture='fist';else if(d<.06&&ext>=2)gesture='pinch';else if(ext>=4)gesture='open';else gesture='none'}else{handOn=false;gesture='none'};updateUI()});camInst=new c.Camera(vid,{onFrame:async()=>{if(hands)await hands.send({image:vid})},width:320,height:240});await camInst.start()}catch(e){console.warn('Camera:',e.message);switchMode('mouse')}
}
function updateUI(){const d=document.querySelector('#gbar .dot'),l=document.querySelector('#gbar .lbl');const a=gesture!=='none';d.className='dot'+(a?' a':'');l.className='lbl'+(a?' a':'');l.textContent={open:'PALM · READY',pinch:'PINCH · GRAB',fist:'FIST · CONFIRM',none:mode==='mouse'?'MOUSE MODE':'STANDBY'}[gesture]}
function switchMode(m){mode=m;document.getElementById('tgl').textContent=m==='mouse'?'🖱 MOUSE':'🖐 GESTURE';document.getElementById('cur').style.display=m==='mouse'?'block':'none'}
window.toggleMode=()=>{if(mode==='camera')switchMode('mouse');else{switchMode('camera');if(!hands)startCamera()}}

// ═══════════════ ACTIONS ═══════════════
function doGrab(){
  if(S.phase!=='ready'||!S.hovered)return
  S.phase='grabbed';S.current=S.hovered;S.orient=Math.random()<.5?'upright':'reversed'
  const m=cards.find(c=>c.userData.card.id===S.hovered.id);if(!m)return
  m.userData.grabbed=true;S.grabbed=m
}

function doConfirm(){
  if(S.phase!=='grabbed'||!S.grabbed)return
  S.phase='ash';S.drawCount++
  const m=S.grabbed;S.drawn.push({...S.current,orientation:S.orient})
  S.deck=S.deck.filter(c=>c.id!==S.current.id)
  // Show result
  const res=document.getElementById('result');const d=S.current
  res.querySelector('.rname').textContent=d.cn;const rf=res.querySelector('.rform');rf.textContent=S.orient==='upright'?'STABLE FORM':'DECAYED FORM';rf.className='rform '+(S.orient==='upright'?'up':'rev');res.querySelector('.rdesc').textContent=S.orient==='upright'?d.up:d.rev;res.style.display='flex'
  updateHistory();updateStats()
  spawnAsh(m.position.clone(),S.orient)
  scene.remove(m);m.geometry.dispose();m.userData.front.dispose();m.userData.back.dispose()
  const idx=cards.indexOf(m);if(idx>-1)cards.splice(idx,1)
  S.grabbed=null
  setTimeout(()=>{res.style.display='none';S.current=null;S.orient=null;S.phase='idle';if(S.deck.length>0)buildSpread()},3000)
}

function doRelease(){if(S.phase!=='grabbed'||!S.grabbed)return;S.grabbed.userData.grabbed=false;S.grabbed=null;S.phase='ready'}

function updateHistory(){document.getElementById('hist').innerHTML=S.drawn.slice(-10).reverse().map(d=>`<div class="e ${d.orientation==='upright'?'up':''}"><div class="n">${d.cn} ${d.orientation==='reversed'?'⟲':''}</div><div class="t">${d.orientation==='reversed'?d.rev:d.up}</div></div>`).join('')}
function updateStats(){document.getElementById('sc').textContent=`${S.deck.length}/${CARDS.length}`}

// ═══════════════ MOUSE ═══════════════
document.addEventListener('mousemove',e=>{if(mode==='mouse')cursor={x:e.clientX/W,y:e.clientY/H};document.getElementById('cur').style.left=e.clientX+'px';document.getElementById('cur').style.top=e.clientY+'px'})
document.addEventListener('click',()=>{if(mode!=='mouse')return;if(S.phase==='idle'){S.phase='ready'}else if(S.phase==='ready'&&S.hovered)doGrab();else if(S.phase==='grabbed')doConfirm()})
document.addEventListener('contextmenu',e=>{e.preventDefault();doRelease()})

// ═══════════════ LOOP ═══════════════
function loop(t){
  requestAnimationFrame(loop)
  const dt=Math.min((t-(loop._last||t))/1000,.1);loop._last=t

  // Stars
  stars.rotation.y+=.00015;stars.rotation.x+=.00005

  // Gesture debounce
  if(gesture!==prevGesture){prevGesture=gesture;gestureTimer=0}else gestureTimer+=dt
  if(gestureTimer>.35&&mode==='camera'){
    if(gesture==='open'&&S.phase==='idle')S.phase='ready'
    if(gesture==='pinch'&&S.phase==='ready'&&S.hovered)doGrab()
    if(gesture==='fist'&&S.phase==='grabbed')doConfirm()
  }

  // Raycast
  const cx=mode==='camera'&&handOn?cursor.x:cursor.x
  const cy=mode==='camera'&&handOn?cursor.y:cursor.y
  if(S.phase!=='ash')raycast(cx,cy)

  // Grabbed card → camera
  if(S.grabbed){const m=S.grabbed;m.position.lerp(new THREE.Vector3(0,.5,2),.1);m.rotation.x=THREE.MathUtils.lerp(m.rotation.x,0,.12);m.rotation.y=THREE.MathUtils.lerp(m.rotation.y,0,.12);m.rotation.z=THREE.MathUtils.lerp(m.rotation.z,S.orient==='reversed'?Math.PI:0,.12);m.scale.lerp(new THREE.Vector3(1.9,1.9,1),.1);continue}

  // Card physics
  cards.forEach(m=>{if(m.userData.grabbed||S.phase==='ash')return;m.position.lerp(m.userData.basePos,.05);m.rotation.x=THREE.MathUtils.lerp(m.rotation.x,m.userData.baseRot.x,.05);m.rotation.y=THREE.MathUtils.lerp(m.rotation.y,m.userData.baseRot.y,.05);m.rotation.z=THREE.MathUtils.lerp(m.rotation.z,m.userData.baseRot.z,.05);m.scale.lerp(new THREE.Vector3(1,1,1),.05);m.userData.targetY=m.userData.hovered?m.userData.basePos.y+.18:m.userData.basePos.y;m.position.y=THREE.MathUtils.lerp(m.position.y,m.userData.targetY,.15)})

  // Particles
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vx+=(Math.random()-.5)*.003;p.life-=.005;if(p.life<=0)particles.splice(i,1)}
  if(ashSys.visible){const n=Math.min(particles.length,300);for(let i=0;i<n;i++){const p=particles[i];ashPosArr[i*3]=p.x;ashPosArr[i*3+1]=p.y;ashPosArr[i*3+2]=p.z;ashSizeArr[i]=p.sz*p.life}ashGeo.attributes.position.needsUpdate=true;ashGeo.attributes.size.needsUpdate=true;ashSys.material.opacity=Math.min(.8,particles.length/40);if(particles.length===0)ashSys.visible=false}

  // Camera
  cam.position.x=Math.sin(t*.00025)*.4;renderer.toneMappingExposure=1.2+Math.sin(t*.0004)*.05
  composer.render()
}
loop._last=0;requestAnimationFrame(loop)

window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();composer.setSize(innerWidth,innerHeight)})
window.addEventListener('error',e=>{const el=document.getElementById('err');el.textContent='[JS] '+e.message;el.style.display='block'})
window.addEventListener('unhandledrejection',e=>{const el=document.getElementById('err');el.textContent='[Promise] '+(e.reason?.message||e.reason);el.style.display='block'})

// ═══════════════ INIT ═══════════════
buildSpread();startCamera();document.getElementById('cur').style.display=mode==='mouse'?'block':'none'
console.log('🃏 TAROT · FBC Entity Archive · EffectComposer+Bloom · Gesture/Mouse')
</script></body></html>
