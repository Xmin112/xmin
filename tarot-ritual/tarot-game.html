</style></head><body>

<script type="module">
import * as THREE from 'three'

// Show errors visibly
window._showErr=function(m){const e=document.getElementById('er');e.textContent=m;e.style.display='block'}
window.addEventListener('error',e=>window._showErr('[JS] '+e.message))
window.addEventListener('unhandledrejection',e=>window._showErr('[P] '+(e.reason?.message||e.reason)))

// ═══════ DATA ═══════
const D=[{id:0,en:'The Fool',cn:'愚者',up:'新的旅程·纯真无畏',rv:'鲁莽冒险·不计后果'},
{id:1,en:'The Magician',cn:'魔术师',up:'创造力·技能·意志',rv:'操控欺骗·浪费才能'},
{id:2,en:'The High Priestess',cn:'女祭司',up:'直觉·潜意识·内在智慧',rv:'忽视直觉·表面化'},
{id:3,en:'The Empress',cn:'女皇',up:'丰盛自然·母性之美',rv:'依赖·过度保护'},
{id:4,en:'The Emperor',cn:'皇帝',up:'权威结构·稳定领导',rv:'专制僵化·控制欲'},
{id:5,en:'The Hierophant',cn:'教皇',up:'传统信仰·精神指导',rv:'打破常规·个人信念'},
{id:6,en:'The Lovers',cn:'恋人',up:'爱情和谐·重要选择',rv:'不和谐·错误选择'},
{id:7,en:'The Chariot',cn:'战车',up:'决心意志·胜利在望',rv:'方向失控·缺乏动力'},
{id:8,en:'Strength',cn:'力量',up:'温柔坚定·内在力量',rv:'自我怀疑·暴力压制'},
{id:9,en:'The Hermit',cn:'隐士',up:'内省独处·寻找真理',rv:'孤立逃避·自我封闭'},
{id:10,en:'Wheel of Fortune',cn:'命运之轮',up:'命运转折·好运降临',rv:'厄运连连·抗拒改变'},
{id:11,en:'Justice',cn:'正义',up:'公正真相·因果回报',rv:'不公正·不负责任'},
{id:12,en:'The Hanged Man',cn:'倒吊人',up:'牺牲放手·新视角',rv:'拖延抗拒·自我牺牲'},
{id:13,en:'Death',cn:'死神',up:'结束转变·新的开始',rv:'抗拒改变·停滞不前'},
{id:14,en:'Temperance',cn:'节制',up:'平衡耐心·和谐共处',rv:'失衡过度·缺乏耐心'},
{id:15,en:'The Devil',cn:'恶魔',up:'认识束缚·解放自我',rv:'否认束缚·物质主义'},
{id:16,en:'The Tower',cn:'塔',up:'突变破坏·真正自由',rv:'逃避恐惧·延长痛苦'},
{id:17,en:'The Star',cn:'星星',up:'希望灵感·暴风已过',rv:'绝望失信·看不到光'},
{id:18,en:'The Moon',cn:'月亮',up:'幻象恐惧·直觉导航',rv:'被假象蒙蔽·沉溺恐惧'},
{id:19,en:'The Sun',cn:'太阳',up:'快乐成功·温暖活力',rv:'暂时挫折·过度乐观'},
{id:20,en:'Judgement',cn:'审判',up:'觉醒重生·更高使命',rv:'拒绝反思·自我怀疑'},
{id:21,en:'The World',cn:'世界',up:'完成圆满·周期终结',rv:'未完成·缺乏闭合'}]

// ═══════ STATE ═══════
const S={phase:'idle',deck:[...D],drawn:[],hovered:null,grabbed:null,current:null,orient:null,count:0}
let mode='camera',gesture='none',cursor={x:.5,y:.5},handOn=false,gt=0,prev='none'

// ═══════ THREE ═══════
const r=new THREE.WebGLRenderer({antialias:true,alpha:false})
r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.toneMapping=THREE.ReinhardToneMapping;r.toneMappingExposure=1.3
document.body.prepend(r.domElement)

const scene=new THREE.Scene();scene.background=new THREE.Color(0x050508);scene.fog=new THREE.FogExp2(0x050508,.0006)
const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,40);cam.position.set(0,.3,6);cam.lookAt(0,-.1,0)

scene.add(new THREE.AmbientLight(0x1a1a2e,.6))
const kl=new THREE.DirectionalLight(0xe8e0d5,1.6);kl.position.set(4,6,5);scene.add(kl)
const rl=new THREE.DirectionalLight(0x8b0000,.5);rl.position.set(-3,-2,-4);scene.add(rl)
scene.add((()=>{const p=new THREE.PointLight(0xc0392b,.5,10);p.position.set(0,3.5,0);return p})())

// Stars
const st=new THREE.Points((()=>{const g=new THREE.BufferGeometry();const p=new Float32Array(600*3);const c=new Float32Array(600*3);for(let i=0;i<600;i++){const t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),rd=9+Math.random()*7;p[i*3]=rd*Math.sin(ph)*Math.cos(t);p[i*3+1]=rd*Math.sin(ph)*Math.sin(t);p[i*3+2]=rd*Math.cos(ph);const rr=Math.random()>.88;c[i*3]=rr?.7:.25+Math.random()*.4;c[i*3+1]=rr?.05:.2+Math.random()*.3;c[i*3+2]=rr?.05:.2+Math.random()*.3}g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));return g})(),new THREE.PointsMaterial({size:.04,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.65}))
scene.add(st)

// Grid
scene.add((()=>{const g=new THREE.GridHelper(10,30,0x331111,0x111118);g.position.y=-3;g.material.opacity=.1;g.material.transparent=true;return g})())

// ═══════ CARDS ═══════
const ld=new THREE.TextureLoader(),tx={}
const getTex=(id)=>{if(!tx[id])tx[id]=ld.load(`/cards/major_${String(id).padStart(2,'0')}.png`);return tx[id]}
const bt=(()=>{const c=document.createElement('canvas');c.width=256;c.height=400;const x=c.getContext('2d');x.fillStyle='#0a0a10';x.fillRect(0,0,256,400);x.strokeStyle='rgba(192,57,43,.25)';x.lineWidth=2;x.strokeRect(8,8,240,384);x.strokeStyle='rgba(192,57,43,.1)';x.strokeRect(18,18,220,364);x.beginPath();x.moveTo(128,28);x.lineTo(222,200);x.lineTo(34,200);x.closePath();x.strokeStyle='rgba(192,57,43,.35)';x.stroke();x.beginPath();x.moveTo(128,170);x.lineTo(186,65);x.lineTo(70,65);x.closePath();x.strokeStyle='rgba(192,57,43,.12)';x.stroke();x.fillStyle='rgba(192,57,43,.5)';x.beginPath();x.arc(128,130,3.5,0,Math.PI*2);x.fill();x.font='bold 16px monospace';x.fillStyle='#c0392b';x.textAlign='center';x.fillText('CLASSIFIED',128,270);x.font='8px monospace';x.fillStyle='rgba(107,107,107,.5)';x.fillText('FBC·PARANATURAL',128,288);return new THREE.CanvasTexture(c)})()

let cards=[]
function mkCard(d){
  const g=new THREE.PlaneGeometry(.68,1.1)
  const f=new THREE.MeshStandardMaterial({map:getTex(d.id),roughness:.45,metalness:.05,emissive:new THREE.Color(0x110000),emissiveIntensity:.15})
  const b=new THREE.MeshStandardMaterial({map:bt,roughness:.35,metalness:.2,emissive:new THREE.Color(0x110000),emissiveIntensity:.1})
  const m=new THREE.Mesh(g,f);m.castShadow=true;m.receiveShadow=true
  m.userData={card:d,fm:f,bm:b,flipped:false,bp:new THREE.Vector3,br:new THREE.Euler,ang:0,grabbed:false,hov:false,ty:0}
  return m
}

function buildCards(){
  cards.forEach(m=>{scene.remove(m);m.geometry.dispose();m.userData.fm.dispose();m.userData.bm.dispose()});cards=[]
  const n=S.deck.length,R=3.4,A=Math.PI*.62
  for(let i=0;i<n;i++){
    const mc=mkCard(S.deck[i]),a=-A/2+(i/Math.max(n-1,1))*A
    mc.position.set(Math.sin(a)*R,(i%3)*.04-.15,Math.cos(a)*R-.7)
    mc.rotation.set(-.16,-a,(Math.random()-.5)*.05)
    mc.userData.bp.copy(mc.position);mc.userData.br.copy(mc.rotation);mc.userData.ang=a
    scene.add(mc);cards.push(mc)
  }
}

// ═══════ PARTICLES ═══════
const ag=new THREE.BufferGeometry();const ap=new Float32Array(300*3);const as=new Float32Array(300)
ag.setAttribute('position',new THREE.BufferAttribute(ap,3));ag.setAttribute('size',new THREE.BufferAttribute(as,1))
const asys=new THREE.Points(ag,new THREE.PointsMaterial({size:.05,color:0xff3333,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}))
asys.visible=false;scene.add(asys);let pt=[]

function ash(pos,orient){
  for(let i=0;i<200;i++)pt.push({x:pos.x,y:pos.y,z:pos.z,vx:(Math.random()-.5)*.08,vy:Math.random()*.07+.02,vz:(Math.random()-.5)*.06,life:1,sz:.02+Math.random()*.06,rd:orient==='reversed'&&Math.random()>.35})
  asys.visible=true
}

// ═══════ RAYCASTER ═══════
const rc=new THREE.Raycaster()
function ray(x,y){
  rc.setFromCamera(new THREE.Vector2(x*2-1,-y*2+1),cam)
  cards.forEach(m=>{m.userData.hov=false;m.material=m.userData.bm;m.material.emissiveIntensity=.1})
  const h=rc.intersectObjects(cards.filter(m=>!m.userData.grabbed))
  const tp=document.getElementById('tp')
  if(h.length>0&&!S.grabbed){const m=h[0].object;m.userData.hov=true;m.material=m.userData.fm;m.material.emissiveIntensity=.35;S.hovered=m.userData.card;if(S.phase!=='ash'){tp.querySelector('.n').textContent=m.userData.card.cn;tp.querySelector('.e').textContent=m.userData.card.en;tp.style.display='block'}}
  else{if(S.phase!=='ash'){S.hovered=null;tp.style.display='none'}}
}

// ═══════ GESTURES ═══════
let hands=null,ci=null
const vid=document.createElement('video');vid.autoplay=true;vid.playsInline=true;vid.muted=true;vid.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(vid)

async function startCam(){
  try{window.Module=window.Module||{};const V='0.4.1675469240';const m=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/hands@${V}/+esm`);const c=await import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/+esm');hands=new m.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@${V}/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.5,minTrackingConfidence:.4});hands.onResults(r=>{if(r.multiHandLandmarks?.length>0){handOn=true;const lm=r.multiHandLandmarks[0];if(lm[8])cursor={x:1-lm[8].x,y:lm[8].y};const tips=[4,8,12,16,20],mcps=[2,5,9,13,17];let ext=0;tips.forEach((t,i)=>{if(lm[t]&&lm[mcps[i]])ext+=i===0?Math.abs(lm[t].x-lm[mcps[i]].x)>.05?1:0:lm[t].y<lm[mcps[i]].y?1:0});const d=lm[4]&&lm[8]?Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y):1;if(ext<=1)gesture='fist';else if(d<.06&&ext>=2)gesture='pinch';else if(ext>=4)gesture='open';else gesture='none'}else{handOn=false;gesture='none'};ui()});ci=new c.Camera(vid,{onFrame:async()=>{if(hands)await hands.send({image:vid})},width:320,height:240});await ci.start()}catch(e){console.warn('CAM:',e.message);sw('mouse')}
}
function ui(){const d=document.querySelector('#gb .d'),l=document.querySelector('#gb .l');const a=gesture!=='none';d.className='d'+(a?' on':'');l.className='l'+(a?' on':'');l.textContent={open:'PALM',pinch:'PINCH',fist:'FIST',none:mode==='mouse'?'MOUSE':'STANDBY'}[gesture]}
function sw(m){mode=m;document.getElementById('tg').textContent=m==='mouse'?'🖱 MOUSE':'🖐 GESTURE';document.getElementById('cur').style.display=m==='mouse'?'block':'none'}
window._tg=()=>{if(mode==='camera')sw('mouse');else{sw('camera');if(!hands)startCam()}}

// ═══════ ACTIONS ═══════
function grab(){if(S.phase!=='ready'||!S.hovered)return;S.phase='grabbed';S.current=S.hovered;S.orient=Math.random()<.5?'upright':'reversed';const m=cards.find(c=>c.userData.card.id===S.hovered.id);if(!m)return;m.userData.grabbed=true;S.grabbed=m}
function confirm(){if(S.phase!=='grabbed'||!S.grabbed)return;S.phase='ash';S.count++;const m=S.grabbed;S.drawn.push({...S.current,orientation:S.orient});S.deck=S.deck.filter(c=>c.id!==S.current.id);const rs=document.getElementById('rs'),d=S.current;rs.querySelector('.rn').textContent=d.cn;const rf=rs.querySelector('.rf');rf.textContent=S.orient==='upright'?'STABLE':'DECAYED';rf.className='rf '+(S.orient==='upright'?'u':'v');rs.querySelector('.rd').textContent=S.orient==='upright'?d.up:d.rv;rs.style.display='flex';hist();stats();ash(m.position.clone(),S.orient);scene.remove(m);m.geometry.dispose();m.userData.fm.dispose();m.userData.bm.dispose();const idx=cards.indexOf(m);if(idx>-1)cards.splice(idx,1);S.grabbed=null;setTimeout(()=>{rs.style.display='none';S.current=null;S.orient=null;S.phase='idle';if(S.deck.length>0)buildCards()},3000)}
function release(){if(S.phase!=='grabbed'||!S.grabbed)return;S.grabbed.userData.grabbed=false;S.grabbed=null;S.phase='ready'}
function hist(){document.getElementById('hi').innerHTML=S.drawn.slice(-10).reverse().map(d=>`<div class="x ${d.orientation==='upright'?'u':''}"><div class="c">${d.cn} ${d.orientation==='reversed'?'⟲':''}</div><div class="t">${d.orientation==='reversed'?d.rv:d.up}</div></div>`).join('')}
function stats(){document.getElementById('sc').textContent=`${S.deck.length}/${D.length}`}

// ═══════ MOUSE ═══════
document.addEventListener('mousemove',e=>{if(mode==='mouse')cursor={x:e.clientX/innerWidth,y:e.clientY/innerHeight};document.getElementById('cur').style.left=e.clientX+'px';document.getElementById('cur').style.top=e.clientY+'px'})
document.addEventListener('click',()=>{if(mode!=='mouse')return;if(S.phase==='idle')S.phase='ready';else if(S.phase==='ready'&&S.hovered)grab();else if(S.phase==='grabbed')confirm()})
document.addEventListener('contextmenu',e=>{e.preventDefault();release()})

// ═══════ LOOP ═══════
function loop(t){
  requestAnimationFrame(loop);const dt=Math.min((t-(loop._t||t))/1000,.1);loop._t=t
  st.rotation.y+=.00015;st.rotation.x+=.00005
  if(gesture!==prev){prev=gesture;gt=0}else gt+=dt
  if(gt>.35&&mode==='camera'){if(gesture==='open'&&S.phase==='idle')S.phase='ready';if(gesture==='pinch'&&S.phase==='ready'&&S.hovered)grab();if(gesture==='fist'&&S.phase==='grabbed')confirm()}
  const cx=mode==='camera'&&handOn?cursor.x:cursor.x,cy=mode==='camera'&&handOn?cursor.y:cursor.y
  if(S.phase!=='ash')ray(cx,cy)
  if(S.grabbed){const m=S.grabbed;m.position.lerp(new THREE.Vector3(0,.5,2),.1);m.rotation.x=THREE.MathUtils.lerp(m.rotation.x,0,.12);m.rotation.y=THREE.MathUtils.lerp(m.rotation.y,0,.12);m.rotation.z=THREE.MathUtils.lerp(m.rotation.z,S.orient==='reversed'?Math.PI:0,.12);m.scale.lerp(new THREE.Vector3(1.9,1.9,1),.1)}
  else cards.forEach(m=>{if(m.userData.grabbed)return;m.position.lerp(m.userData.bp,.05);m.rotation.x=THREE.MathUtils.lerp(m.rotation.x,m.userData.br.x,.05);m.rotation.y=THREE.MathUtils.lerp(m.rotation.y,m.userData.br.y,.05);m.rotation.z=THREE.MathUtils.lerp(m.rotation.z,m.userData.br.z,.05);m.scale.lerp(new THREE.Vector3(1,1,1),.05);m.userData.ty=m.userData.hov?m.userData.bp.y+.2:m.userData.bp.y;m.position.y=THREE.MathUtils.lerp(m.position.y,m.userData.ty,.15)})
  for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vx+=(Math.random()-.5)*.003;p.life-=.005;if(p.life<=0)pt.splice(i,1)}
  if(asys.visible){const n=Math.min(pt.length,300);for(let i=0;i<n;i++){const p=pt[i];ap[i*3]=p.x;ap[i*3+1]=p.y;ap[i*3+2]=p.z;as[i]=p.sz*p.life}ag.attributes.position.needsUpdate=true;ag.attributes.size.needsUpdate=true;asys.material.opacity=Math.min(.8,pt.length/40);if(pt.length===0)asys.visible=false}
  cam.position.x=Math.sin(t*.00025)*.4;r.render(scene,cam)
}
loop._t=0;requestAnimationFrame(loop)
window.addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()})

buildCards();startCam();document.getElementById('cur').style.display=mode==='mouse'?'block':'none'
