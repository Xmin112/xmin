<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TAROT · FBC Entity Archive</title>
<style>
:root{--bg:#050508;--r:#c0392b;--b:#e8e0d5;--g:#6b6b6b;--p:rgba(14,14,20,.88)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:'JetBrains Mono',monospace;color:var(--b);width:100vw;height:100vh}
canvas{display:block;position:fixed;inset:0;z-index:0}

/* Header */
#hdr{position:fixed;top:0;left:0;right:0;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;z-index:30;background:linear-gradient(180deg,rgba(5,5,8,.97),transparent)}
#hdr h1{font-size:15px;font-weight:700;letter-spacing:.5em;background:linear-gradient(135deg,var(--b) 0%,#c9a96e 40%,var(--r) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
#hdr span{font-size:7px;color:var(--g);letter-spacing:.25em}

/* Stats */
#stats{position:fixed;right:14px;top:68px;z-index:30;display:flex;flex-direction:column;gap:3px}
#stats .row{display:flex;justify-content:space-between;gap:16px;padding:5px 10px;background:var(--p);border:1px solid rgba(255,255,255,.04);backdrop-filter:blur(14px);font-size:7px;cursor:pointer;transition:border-color .3s}
#stats .row:hover{border-color:rgba(192,57,43,.25)}
#stats .lbl{color:var(--g);text-transform:uppercase;letter-spacing:.15em}
#stats .val{color:var(--b);font-weight:500}

/* Toggle */
#tgl{position:fixed;top:68px;right:14px;background:var(--p);border:1px solid rgba(255,255,255,.06);color:var(--g);padding:6px 12px;cursor:pointer;font-size:7px;letter-spacing:.2em;text-transform:uppercase;z-index:31;backdrop-filter:blur(14px);transition:all .3s}
#tgl:hover{border-color:rgba(192,57,43,.4);color:var(--r)}

/* Gesture bar */
#gbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;padding:7px 18px;background:var(--p);border:1px solid rgba(255,255,255,.04);backdrop-filter:blur(14px)}
#gbar .dot{width:7px;height:7px;border-radius:50%;background:#222;flex-shrink:0;transition:all .3s}
#gbar .dot.on{background:var(--r);box-shadow:0 0 12px rgba(192,57,43,.7)}
#gbar .txt{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);transition:color .3s}
#gbar .txt.on{color:var(--b)}

/* Tooltip */
#tip{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:30;padding:9px 18px;background:var(--p);border:1px solid rgba(192,57,43,.2);backdrop-filter:blur(14px);text-align:center;display:none}
#tip .nm{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
#tip .en{font-size:7px;color:var(--g);letter-spacing:.1em;margin-top:3px}

/* Result */
#res{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:40;display:none;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
#res .rn{font-size:22px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--b)}
#res .rf{font-size:9px;letter-spacing:.25em;text-transform:uppercase;padding:4px 14px;border:1px solid}
#res .rf.up{color:#c9a96e;border-color:rgba(201,169,110,.4)}
#res .rf.rv{color:var(--r);border-color:rgba(192,57,43,.5)}
#res .rd{font-size:10px;color:var(--g);text-align:center;max-width:280px;line-height:1.8}

/* History */
#hist{position:fixed;right:10px;top:145px;width:165px;max-height:42vh;overflow-y:auto;z-index:30;display:flex;flex-direction:column;gap:2px}
#hist .ent{background:var(--p);border-left:3px solid var(--r);padding:6px 8px;font-size:7px;backdrop-filter:blur(8px)}
#hist .ent.up{border-left-color:#c9a96e}
#hist .ent .cn{color:var(--b);font-weight:600;text-transform:uppercase}
#hist .ent .tx{color:var(--g);margin-top:2px;line-height:1.3}

/* Cursor */
#cur{position:fixed;width:22px;height:22px;pointer-events:none;z-index:100;display:none}
#cur svg{width:100%;height:100%}

/* Error */
#err{position:fixed;bottom:0;left:0;right:0;background:rgba(80,0,0,.95);color:#f66;padding:6px 12px;font-size:8px;z-index:999;display:none;cursor:pointer;font-family:monospace}
</style>
</head>
<body>

<div id="hdr"><h1>TAROT</h1><span>FBC · CASE 22</span></div>
<button id="tgl">🖐 GESTURE</button>
<div id="stats">
  <div class="row"><span class="lbl">CARDS</span><span class="val" id="sc">22/22</span></div>
  <div class="row" onclick="document.documentElement.requestFullscreen()"><span class="lbl">FULLSCREEN</span><span class="val">OFF</span></div>
</div>
<div id="gbar"><div class="dot"></div><span class="txt">STANDBY</span></div>
<div id="tip"><div class="nm"></div><div class="en"></div></div>
<div id="res"><div class="rn"></div><div class="rf"></div><div class="rd"></div></div>
<div id="hist"></div>
<div id="cur"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="rgba(192,57,43,.7)" stroke-width="1"/><circle cx="11" cy="11" r="1.5" fill="rgba(192,57,43,.8)"/></svg></div>
<div id="err" onclick="this.style.display='none'"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<script type="module">
import * as THREE from 'three'

const $=id=>document.getElementById(id)
const err=(m)=>{const e=$('err');e.textContent=m;e.style.display='block'}
window.addEventListener('error',ev=>err('[JS] '+ev.message))
window.addEventListener('unhandledrejection',ev=>err('[P] '+(ev.reason?.message||ev.reason)))

/* ═════════ DATA ═════════ */
const CD=[{id:0,en:'The Fool',cn:'愚者',up:'新的旅程·纯真无畏',rv:'鲁莽冒险·不计后果'},
{id:1,en:'The Magician',cn:'魔术师',up:'创造力·技能·意志',rv:'操控欺骗·浪费才能'},
{id:2,en:'The High Priestess',cn:'女祭司',up:'直觉·潜意识·内在智慧',rv:'忽视直觉·表面化'},
{id:3,en:'The Empress',cn:'女皇',up:'丰盛自然·母性之美',rv:'依赖·过度保护'},
{id:4,en:'The Emperor',cn:'皇帝',up:'权威结构·稳定领导',rv:'专制僵化·控制欲'},
{id:5,en:'The Hierophant',cn:'教皇',up:'传统信仰·精神指导',rv:'打破常规·个人信念'},
{id:6,en:'The Lovers',cn:'恋人',up:'爱情和谐·重要选择',rv:'不和谐·错误选择'},
{id:7,en:'The Chariot',cn:'战车',up:'决心意志·胜利在望',rv:'方向失控·缺乏动力'},
{id:8,en:'Strength',cn:'力量',up:'温柔坚定·内在力量',rv:'自我怀疑·暴力压制'},
{id:9,en:'The Hermit',cn:'隐士',up:'内省独处·寻找真理',rv:'孤立逃避·自我封闭'},
{id:10,en:'Wheel of Fortune',cn:'命运之轮',up:'命运转折·好运降临',rv:'厄运连连·抗拒改变'},
{id:11,en:'Justice',cn:'正义',up:'公正真相·因果回报',rv:'不公正·不负责任'},
{id:12,en:'The Hanged Man',cn:'倒吊人',up:'牺牲放手·新视角',rv:'拖延抗拒·自我牺牲'},
{id:13,en:'Death',cn:'死神',up:'结束转变·新的开始',rv:'抗拒改变·停滞不前'},
{id:14,en:'Temperance',cn:'节制',up:'平衡耐心·和谐共处',rv:'失衡过度·缺乏耐心'},
{id:15,en:'The Devil',cn:'恶魔',up:'认识束缚·解放自我',rv:'否认束缚·物质主义'},
{id:16,en:'The Tower',cn:'塔',up:'突变破坏·真正自由',rv:'逃避恐惧·延长痛苦'},
{id:17,en:'The Star',cn:'星星',up:'希望灵感·暴风已过',rv:'绝望失信·看不到光'},
{id:18,en:'The Moon',cn:'月亮',up:'幻象恐惧·直觉导航',rv:'被假象蒙蔽·沉溺恐惧'},
{id:19,en:'The Sun',cn:'太阳',up:'快乐成功·温暖活力',rv:'暂时挫折·过度乐观'},
{id:20,en:'Judgement',cn:'审判',up:'觉醒重生·更高使命',rv:'拒绝反思·自我怀疑'},
{id:21,en:'The World',cn:'世界',up:'完成圆满·周期终结',rv:'未完成·缺乏闭合'}]

/* ═════════ STATE ═════════ */
const state={phase:'idle',deck:[...CD],drawn:[],hovered:null,grabbedMesh:null,curCard:null,orient:null,drawCount:0}
let inputMode='camera',curGesture='none',pointerPos={x:.5,y:.5},handVisible=false
let gestureTick=0,lastGesture='none'

/* ═════════ THREE.JS SETUP ═════════ */
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setPixelRatio(Math.min(devicePixelRatio,2))
renderer.setSize(innerWidth,innerHeight)
renderer.toneMapping=THREE.ReinhardToneMapping
renderer.toneMappingExposure=1.4
document.body.prepend(renderer.domElement)

const scene=new THREE.Scene()
scene.background=new THREE.Color(0x050508)
scene.fog=new THREE.FogExp2(0x050508,0.0005)

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,35)
camera.position.set(0,0.35,6.2)
camera.lookAt(0,-0.05,0)

/* Lighting */
scene.add(new THREE.AmbientLight(0x1a1a2e,0.55))
const keyLight=new THREE.DirectionalLight(0xe8e0d5,1.8)
keyLight.position.set(4,6,5)
scene.add(keyLight)
const rimLight=new THREE.DirectionalLight(0x8b0000,0.55)
rimLight.position.set(-3,-2,-4)
scene.add(rimLight)
const pointLight=new THREE.PointLight(0xc0392b,0.5,12)
pointLight.position.set(0,3.5,0)
scene.add(pointLight)

/* Stars */
const starGeo=new THREE.BufferGeometry()
const starPos=new Float32Array(600*3)
const starCol=new Float32Array(600*3)
for(let i=0;i<600;i++){
  const theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1),rad=9+Math.random()*7
  starPos[i*3]=rad*Math.sin(phi)*Math.cos(theta)
  starPos[i*3+1]=rad*Math.sin(phi)*Math.sin(theta)
  starPos[i*3+2]=rad*Math.cos(phi)
  const isRed=Math.random()>0.88
  starCol[i*3]=isRed?0.7:0.25+Math.random()*0.4
  starCol[i*3+1]=isRed?0.05:0.2+Math.random()*0.3
  starCol[i*3+2]=isRed?0.05:0.2+Math.random()*0.3
}
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3))
starGeo.setAttribute('color',new THREE.BufferAttribute(starCol,3))
const starsMesh=new THREE.Points(starGeo,new THREE.PointsMaterial({size:0.04,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.7}))
scene.add(starsMesh)

/* Grid */
const gridHelper=new THREE.GridHelper(10,30,0x331111,0x111118)
gridHelper.position.y=-3
gridHelper.material.opacity=0.12
gridHelper.material.transparent=true
scene.add(gridHelper)

/* ═════════ CARDS ═════════ */
const texLoader=new THREE.TextureLoader()
const texCache={}
function loadCardTex(id){
  if(!texCache[id])texCache[id]=texLoader.load(`/cards/major_${String(id).padStart(2,'0')}.png`)
  return texCache[id]
}

/* FBC card back */
const backCanvas=document.createElement('canvas')
backCanvas.width=256;backCanvas.height=400
const bctx=backCanvas.getContext('2d')
bctx.fillStyle='#0a0a10';bctx.fillRect(0,0,256,400)
bctx.strokeStyle='rgba(192,57,43,.28)';bctx.lineWidth=2;bctx.strokeRect(8,8,240,384)
bctx.strokeStyle='rgba(192,57,43,.1)';bctx.lineWidth=1;bctx.strokeRect(18,18,220,364)
bctx.beginPath();bctx.moveTo(128,28);bctx.lineTo(222,200);bctx.lineTo(34,200);bctx.closePath()
bctx.strokeStyle='rgba(192,57,43,.38)';bctx.stroke()
bctx.beginPath();bctx.moveTo(128,170);bctx.lineTo(186,65);bctx.lineTo(70,65);bctx.closePath()
bctx.strokeStyle='rgba(192,57,43,.14)';bctx.stroke()
bctx.fillStyle='rgba(192,57,43,.55)';bctx.beginPath();bctx.arc(128,128,4,0,Math.PI*2);bctx.fill()
bctx.font='bold 16px monospace';bctx.fillStyle='#c0392b';bctx.textAlign='center';bctx.fillText('CLASSIFIED',128,270)
bctx.font='8px monospace';bctx.fillStyle='rgba(107,107,107,.5)';bctx.fillText('FBC · PARANATURAL DIVISION',128,290)
for(let y=20;y<385;y+=14){bctx.fillStyle=`rgba(139,0,0,${0.02+Math.random()*0.01})`;bctx.fillRect(12,y,6,1.5);bctx.fillRect(238,y,6,1.5)}
const backTexture=new THREE.CanvasTexture(backCanvas)

let cardMeshes=[]

function createCardPlane(cardData){
  const geo=new THREE.PlaneGeometry(0.68,1.1)
  const frontMat=new THREE.MeshStandardMaterial({
    map:loadCardTex(cardData.id),roughness:0.45,metalness:0.05,
    emissive:new THREE.Color(0x110000),emissiveIntensity:0.15
  })
  const backMat=new THREE.MeshStandardMaterial({
    map:backTexture,roughness:0.35,metalness:0.2,
    emissive:new THREE.Color(0x110000),emissiveIntensity:0.1
  })
  const mesh=new THREE.Mesh(geo,backMat)
  mesh.castShadow=true;mesh.receiveShadow=true
  mesh.userData={
    card:cardData,frontMat,backMat,
    homePos:new THREE.Vector3,homeRot:new THREE.Euler,
    angle:0,grabbed:false,highlighted:false,targetY:0
  }
  return mesh
}

function buildSpread(){
  cardMeshes.forEach(m=>{
    scene.remove(m);m.geometry.dispose()
    m.userData.frontMat.dispose();m.userData.backMat.dispose()
  })
  cardMeshes=[]
  const n=state.deck.length
  const R=3.4
  const spreadA=Math.PI*0.62
  for(let i=0;i<n;i++){
    const m=createCardPlane(state.deck[i])
    const a=-spreadA/2+(i/Math.max(n-1,1))*spreadA
    m.position.set(Math.sin(a)*R,(i%3)*0.04-0.15,Math.cos(a)*R-0.7)
    m.rotation.set(-0.16,-a,(Math.random()-0.5)*0.05)
    m.userData.homePos.copy(m.position)
    m.userData.homeRot.copy(m.rotation)
    m.userData.angle=a
    scene.add(m)
    cardMeshes.push(m)
  }
}

/* ═════════ ASH PARTICLES ═════════ */
const ashGeometry=new THREE.BufferGeometry()
const ashPositions=new Float32Array(300*3)
const ashSizesArr=new Float32Array(300)
ashGeometry.setAttribute('position',new THREE.BufferAttribute(ashPositions,3))
ashGeometry.setAttribute('size',new THREE.BufferAttribute(ashSizesArr,1))
const ashSystem=new THREE.Points(ashGeometry,new THREE.PointsMaterial({
  size:0.05,color:0xff3333,transparent:true,opacity:0.8,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true
}))
ashSystem.visible=false;scene.add(ashSystem)
let ashParticles=[]

function spawnAsh(worldPos,orientation){
  for(let i=0;i<200;i++){
    ashParticles.push({
      x:worldPos.x,y:worldPos.y,z:worldPos.z,
      vx:(Math.random()-0.5)*0.08,vy:Math.random()*0.07+0.02,vz:(Math.random()-0.5)*0.06,
      life:1,size:0.02+Math.random()*0.06,isRed:orientation==='reversed'&&Math.random()>0.35
    })
  }
  ashSystem.visible=true
}

/* ═════════ RAYCASTER ═════════ */
const raycaster=new THREE.Raycaster()

function doRaycast(x,y){
  raycaster.setFromCamera(new THREE.Vector2(x*2-1,-y*2+1),camera)
  cardMeshes.forEach(m=>{
    m.userData.highlighted=false
    m.material=m.userData.backMat
    m.material.emissiveIntensity=0.1
  })
  const hits=raycaster.intersectObjects(cardMeshes.filter(m=>!m.userData.grabbed))
  if(hits.length>0&&!state.grabbedMesh){
    const m=hits[0].object
    m.userData.highlighted=true
    m.material=m.userData.frontMat
    m.material.emissiveIntensity=0.38
    state.hovered=m.userData.card
    if(state.phase!=='ash'){
      $('tip').querySelector('.nm').textContent=m.userData.card.cn
      $('tip').querySelector('.en').textContent=m.userData.card.en
      $('tip').style.display='block'
    }
  }else{
    if(state.phase!=='ash'){$('tip').style.display='none'}
    state.hovered=null
  }
}

/* ═════════ UI UPDATE ═════════ */
function updateGestureUI(){
  const dot=$('gbar').querySelector('.dot')
  const txt=$('gbar').querySelector('.txt')
  const active=curGesture!=='none'
  dot.className='dot'+(active?' on':'')
  txt.className='txt'+(active?' on':'')
  const labels={open:'PALM · READY',pinch:'PINCH · GRAB',fist:'FIST · CONFIRM',none:inputMode==='mouse'?'MOUSE MODE':'STANDBY'}
  txt.textContent=labels[curGesture]||'STANDBY'
}

function updateHistoryUI(){
  $('hist').innerHTML=state.drawn.slice(-10).reverse().map(d=>
    `<div class="ent ${d.orientation==='upright'?'up':''}">
      <div class="cn">${d.cn} ${d.orientation==='reversed'?'⟲':''}</div>
      <div class="tx">${d.orientation==='reversed'?d.rv:d.up}</div>
    </div>`
  ).join('')
}

function updateStatsUI(){
  $('sc').textContent=`${state.deck.length}/${CD.length}`
}

/* ═════════ GAME ACTIONS ═════════ */
function actionGrab(){
  if(state.phase!=='ready'||!state.hovered)return
  state.phase='grabbed'
  state.curCard=state.hovered
  state.orient=Math.random()<0.5?'upright':'reversed'
  const m=cardMeshes.find(c=>c.userData.card.id===state.hovered.id)
  if(!m)return
  m.userData.grabbed=true
  state.grabbedMesh=m
}

function actionConfirm(){
  if(state.phase!=='grabbed'||!state.grabbedMesh)return
  state.phase='ash'
  state.drawCount++
  const m=state.grabbedMesh
  state.drawn.push({...state.curCard,orientation:state.orient})
  state.deck=state.deck.filter(c=>c.id!==state.curCard.id)
  /* Show result */
  $('res').querySelector('.rn').textContent=state.curCard.cn
  const rf=$('res').querySelector('.rf')
  rf.textContent=state.orient==='upright'?'STABLE FORM':'DECAYED FORM'
  rf.className='rf '+(state.orient==='upright'?'up':'rv')
  $('res').querySelector('.rd').textContent=state.orient==='upright'?state.curCard.up:state.curCard.rv
  $('res').style.display='flex'
  updateHistoryUI()
  updateStatsUI()
  spawnAsh(m.position.clone(),state.orient)
  scene.remove(m)
  m.geometry.dispose();m.userData.frontMat.dispose();m.userData.backMat.dispose()
  cardMeshes.splice(cardMeshes.indexOf(m),1)
  state.grabbedMesh=null
  setTimeout(()=>{
    $('res').style.display='none'
    state.curCard=null;state.orient=null;state.phase='idle'
    if(state.deck.length>0)buildSpread()
  },3000)
}

function actionRelease(){
  if(state.phase!=='grabbed'||!state.grabbedMesh)return
  state.grabbedMesh.userData.grabbed=false
  state.grabbedMesh=null
  state.phase='ready'
}

/* ═════════ MEDIAPIPE ═════════ */
let handsInstance=null,cameraInstance=null
const hiddenVideo=document.createElement('video')
hiddenVideo.autoplay=true;hiddenVideo.playsInline=true;hiddenVideo.muted=true
hiddenVideo.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none'
document.body.appendChild(hiddenVideo)

async function initMediaPipe(){
  try{
    window.Module=window.Module||{}
    const VER='0.4.1675469240'
    const handsMod=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/hands@${VER}/+esm`)
    const cameraMod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/+esm')
    handsInstance=new handsMod.Hands({
      locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@${VER}/${f}`
    })
    handsInstance.setOptions({
      maxNumHands:1,modelComplexity:0,
      minDetectionConfidence:0.5,minTrackingConfidence:0.4
    })
    handsInstance.onResults(results=>{
      if(results.multiHandLandmarks?.length>0){
        handVisible=true
        const lm=results.multiHandLandmarks[0]
        if(lm[8])pointerPos={x:1-lm[8].x,y:lm[8].y}
        /* Count extended fingers */
        const tips=[4,8,12,16,20],mcps=[2,5,9,13,17]
        let extended=0
        tips.forEach((tip,i)=>{
          if(lm[tip]&&lm[mcps[i]]){
            if(i===0)extended+=Math.abs(lm[tip].x-lm[mcps[i]].x)>0.05?1:0
            else extended+=lm[tip].y<lm[mcps[i]].y?1:0
          }
        })
        /* Pinch distance */
        const pinchDist=lm[4]&&lm[8]?Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y):1
        if(extended<=1)curGesture='fist'
        else if(pinchDist<0.06&&extended>=2)curGesture='pinch'
        else if(extended>=4)curGesture='open'
        else curGesture='none'
      }else{handVisible=false;curGesture='none'}
      updateGestureUI()
    })
    cameraInstance=new cameraMod.Camera(hiddenVideo,{
      onFrame:async()=>{if(handsInstance)await handsInstance.send({image:hiddenVideo})},
      width:320,height:240
    })
    await cameraInstance.start()
    $('tgl').textContent='🖐 GESTURE'
    console.log('CAMERA READY')
  }catch(e){
    console.warn('Camera init failed:',e.message)
    switchToMouse()
  }
}

/* ═════════ MODE SWITCH ═════════ */
function switchToMouse(){
  inputMode='mouse'
  $('tgl').textContent='🖱 MOUSE'
  $('cur').style.display='block'
}
function toggleMode(){
  if(inputMode==='camera'){switchToMouse()}
  else{inputMode='camera';$('cur').style.display='none';if(!handsInstance)initMediaPipe()}
}
$('tgl').onclick=toggleMode
window._tg=toggleMode

/* ═════════ MOUSE INPUT ═════════ */
document.addEventListener('mousemove',e=>{
  if(inputMode==='mouse')pointerPos={x:e.clientX/innerWidth,y:e.clientY/innerHeight}
  $('cur').style.left=e.clientX+'px'
  $('cur').style.top=e.clientY+'px'
})
document.addEventListener('click',()=>{
  if(inputMode!=='mouse')return
  if(state.phase==='idle'){state.phase='ready';updateGestureUI()}
  else if(state.phase==='ready'&&state.hovered)actionGrab()
  else if(state.phase==='grabbed')actionConfirm()
})
document.addEventListener('contextmenu',e=>{e.preventDefault();actionRelease()})

/* ═════════ MAIN LOOP ═════════ */
function animate(timestamp){
  requestAnimationFrame(animate)
  const dt=Math.min((timestamp-(animate._prev||timestamp))/1000,0.1)
  animate._prev=timestamp

  /* Stars rotation */
  starsMesh.rotation.y+=0.00012
  starsMesh.rotation.x+=0.00004

  /* Gesture state machine */
  const isCam=inputMode==='camera'
  if(isCam){
    if(curGesture!==lastGesture){lastGesture=curGesture;gestureTick=0}
    else gestureTick+=dt
    const triggered=gestureTick>0.35
    if(triggered){
      if(curGesture==='open'&&state.phase==='idle')state.phase='ready'
      if(curGesture==='pinch'&&state.phase==='ready'&&state.hovered)actionGrab()
      if(curGesture==='fist'&&state.phase==='grabbed')actionConfirm()
    }
  }

  /* Raycast */
  const rx=isCam&&handVisible?pointerPos.x:pointerPos.x
  const ry=isCam&&handVisible?pointerPos.y:pointerPos.y
  if(state.phase!=='ash')doRaycast(rx,ry)

  /* Animate grabbed card towards camera */
  if(state.grabbedMesh){
    const m=state.grabbedMesh
    m.position.lerp(new THREE.Vector3(0,0.55,2.2),0.09)
    m.rotation.x=THREE.MathUtils.lerp(m.rotation.x,0,0.1)
    m.rotation.y=THREE.MathUtils.lerp(m.rotation.y,0,0.1)
    m.rotation.z=THREE.MathUtils.lerp(m.rotation.z,state.orient==='reversed'?Math.PI:0,0.1)
    m.scale.lerp(new THREE.Vector3(1.8,1.8,1),0.08)
  }

  /* Return non-grabbed cards to home */
  cardMeshes.forEach(m=>{
    if(m.userData.grabbed||state.phase==='ash')return
    m.position.lerp(m.userData.homePos,0.05)
    m.rotation.x=THREE.MathUtils.lerp(m.rotation.x,m.userData.homeRot.x,0.05)
    m.rotation.y=THREE.MathUtils.lerp(m.rotation.y,m.userData.homeRot.y,0.05)
    m.rotation.z=THREE.MathUtils.lerp(m.rotation.z,m.userData.homeRot.z,0.05)
    m.scale.lerp(new THREE.Vector3(1,1,1),0.05)
    m.userData.targetY=m.userData.highlighted?m.userData.homePos.y+0.18:m.userData.homePos.y
    m.position.y=THREE.MathUtils.lerp(m.position.y,m.userData.targetY,0.12)
  })

  /* Ash particles */
  for(let i=ashParticles.length-1;i>=0;i--){
    const p=ashParticles[i]
    p.x+=p.vx;p.y+=p.vy;p.z+=p.vz
    p.vx+=(Math.random()-0.5)*0.003
    p.life-=0.005
    if(p.life<=0)ashParticles.splice(i,1)
  }
  if(ashSystem.visible){
    const n=Math.min(ashParticles.length,300)
    for(let i=0;i<n;i++){
      const p=ashParticles[i]
      ashPositions[i*3]=p.x;ashPositions[i*3+1]=p.y;ashPositions[i*3+2]=p.z
      ashSizesArr[i]=p.size*p.life
    }
    ashGeometry.attributes.position.needsUpdate=true
    ashGeometry.attributes.size.needsUpdate=true
    ashSystem.material.opacity=Math.min(0.85,ashParticles.length/40)
    if(ashParticles.length===0)ashSystem.visible=false
  }

  /* Camera sway */
  camera.position.x=Math.sin(timestamp*0.00022)*0.4
  camera.lookAt(0,-0.05,0)

  renderer.render(scene,camera)
}
animate._prev=0
requestAnimationFrame(animate)

/* Resize */
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight)
  camera.aspect=innerWidth/innerHeight
  camera.updateProjectionMatrix()
})

/* ═════════ START ═════════ */
buildSpread()
initMediaPipe()
console.log('🃏 TAROT · FBC Entity Archive · Ready')
</script>
</body>
</html>
