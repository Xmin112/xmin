<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMOS Replica</title>
<style>
:root{--bg:#1a1a2e;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Courier New',monospace;}
canvas{display:block;position:fixed;inset:0;}
#grain{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0.06;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(10,10,30,0.5) 100%);}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none;transition:opacity 0.5s;}
#title h1{font-size:clamp(48px,12vw,120px);font-weight:300;color:#e8e0f0;letter-spacing:0.15em;text-transform:uppercase;}
#title p{font-size:14px;color:#a0a0c0;letter-spacing:0.3em;margin-top:8px;}
#title .scroll-hint{font-size:11px;color:#606080;letter-spacing:0.2em;margin-top:40px;animation:pulse 3s ease-in-out infinite;}
#credit{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;font-size:10px;color:#606080;letter-spacing:0.2em;transition:opacity 0.5s;}
@keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
</style>
</head>
<body>
<div id="grain"></div>
<div id="vignette"></div>
<div id="title">
  <h1>ATMOS</h1>
  <p>by Leeroy</p>
  <span class="scroll-hint">SCROLL TO BEGIN THE JOURNEY</span>
</div>
<div id="credit">Replica — Original by Leeroy Lab</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ═══ SCENE ═══
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a1a2e');

// ═══ CAMERA ═══
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,200);
camera.position.set(0,3,12);

// ═══ RENDERER ═══
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
document.body.prepend(renderer.domElement);

// ═══ SKY SPHERE (inward-facing, Perlin noise gradient) ═══
const skyGeo=new THREE.SphereGeometry(50,64,64);
const skyShader=new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uColor1:{value:new THREE.Color('#4a6fa5')}, // deep blue
    uColor2:{value:new THREE.Color('#c9a8d4')}, // lavender
    uColor3:{value:new THREE.Color('#f0d8c0')}, // warm peach
    uColor4:{value:new THREE.Color('#e8e8f0')}, // light
  },
  vertexShader:/*glsl*/`
    varying vec3 vPos; varying vec2 vUv;
    void main(){
      vec4 worldPos=modelMatrix*vec4(position,1.0);
      vPos=worldPos.xyz; vUv=uv;
      gl_Position=projectionMatrix*viewMatrix*worldPos;
    }`,
  fragmentShader:/*glsl*/`
    varying vec3 vPos; varying vec2 vUv;
    uniform float uTime;
    uniform vec3 uColor1,uColor2,uColor3,uColor4;
    // Simple 2D noise
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){
      vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
    }
    void main(){
      float h=normalize(vPos).y;
      float n=noise(vec2(h*3.0+uTime*0.02,vUv.x*5.0+uTime*0.01))*0.3;
      float t=smoothstep(-0.6,2.0,h+n);
      vec3 col=mix(uColor1,uColor2,smoothstep(-0.3,0.4,t));
      col=mix(col,uColor3,smoothstep(0.3,0.8,t));
      col=mix(col,uColor4,smoothstep(0.7,1.1,t));
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky=new THREE.Mesh(skyGeo,skyShader);
sky.material.side=THREE.BackSide;sky.renderOrder=-1;
scene.add(sky);

// ═══ LIGHTING ═══
const hemiLight=new THREE.HemisphereLight('#8899cc','#445566',0.8);
scene.add(hemiLight);
const dirLight=new THREE.DirectionalLight('#ffe8d0',1.2);
dirLight.position.set(5,8,3);scene.add(dirLight);
scene.add(new THREE.AmbientLight('#334466',0.6));

// ═══ CLOUDS — smooth bubble clusters ═══
const cloudGroup=new THREE.Group();scene.add(cloudGroup);
const cloudMat=new THREE.MeshStandardMaterial({color:'#e8e0f8',roughness:0.7,metalness:0});

function createCloud(x,y,z,scale){
  const g=new THREE.Group();
  const count=8+Math.floor(Math.random()*12);
  for(let i=0;i<count;i++){
    const r=0.5+Math.random()*1.5;
    const s=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),cloudMat.clone());
    s.material.color.setHSL(0.7+Math.random()*0.15,0.1+Math.random()*0.15,0.75+Math.random()*0.2);
    s.position.set((Math.random()-0.5)*3,(Math.random()-0.5)*1.5,(Math.random()-0.5)*2.5);
    s.castShadow=false;g.add(s);
  }
  g.position.set(x,y,z);g.scale.setScalar(scale);
  cloudGroup.add(g);
  return g;
}

// Generate clouds along the path
for(let i=0;i<50;i++){
  const t=i/50;
  const x=(Math.random()-0.5)*60;
  const y=2+Math.random()*12;
  const z=-10+t*40+(Math.random()-0.5)*20;
  createCloud(x,y,z,0.5+Math.random()*2.5);
}

// ═══ PLANE MODEL ═══
const plane=new THREE.Group();
// Fuselage
const fuse=new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3,1.2,8,12),
  new THREE.MeshStandardMaterial({color:'#e8e0f0',roughness:0.3,metalness:0.4}));
fuse.rotation.x=Math.PI/2;plane.add(fuse);
// Wings
const wing=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,0.06,0.6),
  new THREE.MeshStandardMaterial({color:'#d0d0e0',roughness:0.3,metalness:0.3}));
wing.position.set(0,-0.05,0);plane.add(wing);
// Tail
const tail=new THREE.Mesh(
  new THREE.BoxGeometry(0.6,0.04,0.35),
  new THREE.MeshStandardMaterial({color:'#d0d0e0',roughness:0.3,metalness:0.3}));
tail.position.set(0,-0.15,-0.45);plane.add(tail);
// Vertical stabilizer
const vstab=new THREE.Mesh(
  new THREE.BoxGeometry(0.06,0.4,0.35),
  new THREE.MeshStandardMaterial({color:'#d0d0e0',roughness:0.3,metalness:0.3}));
vstab.position.set(0,0.2,-0.35);plane.add(vstab);
plane.position.set(0,3,0);plane.rotation.set(0,0,-0.05);
scene.add(plane);

// ═══ WIND PARTICLES (InstancedMesh) ═══
const particleCount=800;
const particleGeo=new THREE.SphereGeometry(0.04,4,2);
const particleMat=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0});
const particles=new THREE.InstancedMesh(particleGeo,particleMat,particleCount);
const dummy=new THREE.Object3D();
const particleData=[];
for(let i=0;i<particleCount;i++){
  dummy.position.set((Math.random()-0.5)*30,Math.random()*15,(Math.random()-0.5)*30);
  dummy.updateMatrix();particles.setMatrixAt(i,dummy.matrix);
  particleData.push({speed:0.5+Math.random()*2,baseX:dummy.position.x,baseY:dummy.position.y,baseZ:dummy.position.z});
}
scene.add(particles);

// ═══ CATMULL-ROM SPLINE PATH ═══
const pathPoints=[
  new THREE.Vector3(0,3,12),new THREE.Vector3(2,5,8),new THREE.Vector3(-3,6,2),
  new THREE.Vector3(4,4,-5),new THREE.Vector3(-2,7,-12),new THREE.Vector3(3,5,-20),
  new THREE.Vector3(-4,6,-28),new THREE.Vector3(2,4,-36),new THREE.Vector3(0,5,-44),
];
const curve=new THREE.CatmullRomCurve3(pathPoints);

// ═══ TEXT PANELS (Canvas → Texture) ═══
const textPanels=[];
function createTextPanel(text,subtext,t){
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;
  const ctx=canvas.getContext('2d'); if(!ctx)return;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='300 36px "Courier New",monospace';
  ctx.textAlign='center';ctx.fillText(text,256,48);
  ctx.fillStyle='rgba(200,200,220,0.7)';ctx.font='14px "Courier New",monospace';
  ctx.fillText(subtext,256,78);
  const tex=new THREE.CanvasTexture(canvas);tex.minFilter=THREE.LinearFilter;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide});
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(6,1.5),mat);
  const pt=curve.getPointAt(t);panel.position.copy(pt);panel.position.x+=5;
  panel.lookAt(new THREE.Vector3(pt.x,pt.y,pt.z-1));
  scene.add(panel);textPanels.push({mesh:panel,t});
  return panel;
}
createTextPanel('DEPARTURE','The journey begins ahead',0.05);
createTextPanel('ASCENDING','Through the clouds we rise',0.25);
createTextPanel('DRIFTING','Lost in the endless sky',0.45);
createTextPanel('DESCENDING','Gently returning to earth',0.7);
createTextPanel('ARRIVAL','Thank you for flying with us',0.92);

// ═══ SCROLL HANDLER ═══
let scrollProgress=0;
let targetProgress=0;
let scrollVelocity=0;
let lastScroll=0;

window.addEventListener('wheel',(e)=>{
  e.preventDefault();
  targetProgress=Math.max(0,Math.min(1,targetProgress+e.deltaY*0.004));
  scrollVelocity=Math.abs(e.deltaY);
  lastScroll=performance.now();
},{passive:false});
// Click fallback — click anywhere to advance
window.addEventListener('click',()=>{
  targetProgress=Math.min(1,targetProgress+0.04);
  scrollVelocity=40;lastScroll=performance.now();
});
// Keyboard fallback — arrow keys
window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){targetProgress=Math.min(1,targetProgress+0.03);scrollVelocity=40;lastScroll=performance.now();}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){targetProgress=Math.max(0,targetProgress-0.03);scrollVelocity=40;lastScroll=performance.now();}
});

// Touch
let touchStart=0;
window.addEventListener('touchstart',e=>{touchStart=e.touches[0].clientY;});
window.addEventListener('touchmove',e=>{
  e.preventDefault();
  const dy=touchStart-e.touches[0].clientY;
  targetProgress=Math.max(0,Math.min(1,targetProgress+dy*0.006));
  scrollVelocity=Math.abs(dy);
  lastScroll=performance.now();
  touchStart=e.touches[0].clientY;
},{passive:false});

// ═══ ANIMATION LOOP ═══
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  const t=performance.now()*0.001;

  // Smooth scroll progress
  scrollProgress+=(targetProgress-scrollProgress)*3*dt;
  // Decay velocity
  if(t*1000-lastScroll>200)scrollVelocity*=0.9;

  // Camera along spline
  const pt=curve.getPointAt(scrollProgress);
  const tangent=curve.getTangentAt(scrollProgress).normalize();
  camera.position.lerp(
    new THREE.Vector3(pt.x,pt.y+1.5,pt.z+6),
    2*dt
  );
  // Look ahead
  const lookTarget=pt.clone().add(tangent.clone().multiplyScalar(8));
  camera.lookAt(lookTarget.x,lookTarget.y+1,lookTarget.z);

  // Plane follows slightly ahead
  const planePt=curve.getPointAt(Math.min(1,scrollProgress+0.02));
  plane.position.lerp(new THREE.Vector3(planePt.x,planePt.y+0.5,planePt.z-1.5),3*dt);
  // Bank the plane
  const t2=curve.getTangentAt(Math.min(1,scrollProgress+0.02)).normalize();
  plane.rotation.z+=(t2.x*0.3-plane.rotation.z)*2*dt;
  plane.rotation.x+=(t2.y*0.15-plane.rotation.x)*2*dt;

  // Sky time
  skyShader.uniforms.uTime.value=t;

  // Hemisphere light follows sky
  const skyH=0.4+scrollProgress*0.3;
  hemiLight.color.setHSL(0.6+skyH*0.1,0.3,0.5+skyH*0.3);
  hemiLight.intensity=0.6+scrollProgress*0.3;

  // Wind particles
  particleMat.opacity=Math.min(0.6,scrollVelocity*0.002);
  for(let i=0;i<particleCount;i++){
    const d=particleData[i];
    dummy.position.set(d.baseX+(t*10*d.speed)%30-15,d.baseY,d.baseZ+(t*15*d.speed)%30-15);
    dummy.updateMatrix();particles.setMatrixAt(i,dummy.matrix);
  }
  particles.instanceMatrix.needsUpdate=true;

  // Text panels face camera
  textPanels.forEach(p=>{p.mesh.lookAt(camera.position);});

  // Cloud drift
  cloudGroup.children.forEach((c,i)=>{
    c.position.x+=Math.sin(t*0.3+i)*0.003;
    c.position.y+=Math.cos(t*0.2+i)*0.002;
  });

  // Title fade
  const titleEl=document.getElementById('title');
  const creditEl=document.getElementById('credit');
  if(titleEl)titleEl.style.opacity=String(Math.max(0,1-scrollProgress*4));
  if(creditEl)creditEl.style.opacity=String(Math.min(1,scrollProgress*3));

  renderer.render(scene,camera);
}
animate();

// ═══ RESIZE ═══
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
