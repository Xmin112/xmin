<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATMOS — A Flight Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080818}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Syne',sans-serif;font-weight:400;cursor:crosshair}
canvas{position:fixed;inset:0;z-index:0;display:block}
/* §6 Grain — fixed overlay only, per §7 */
body::after{content:'';position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.042;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
/* §6 Vignette — z-index:49 */
#vignette{position:fixed;inset:0;z-index:49;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 38%,rgba(4,4,18,.62) 100%)}
/* §5 Double-Bezel: Outer Shell + Inner Core */
#hero-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none;
  transition:opacity .8s cubic-bezier(.32,.72,0,1)}
#hero-outer{background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04);border-radius:2.5rem;padding:1.5rem}
#hero-inner{background:transparent;border-radius:calc(2.5rem - .75rem);padding:2rem 3rem;text-align:center}
#hero-inner h1{font-size:clamp(48px,13vw,150px);font-weight:500;color:rgba(240,236,255,.9);letter-spacing:.16em;text-transform:uppercase}
#hero-inner .by{font-size:11px;font-weight:500;color:rgba(180,176,210,.48);letter-spacing:.32em;margin-top:8px;text-transform:uppercase}
#hero-inner .scroll{font-size:10px;font-weight:400;color:rgba(130,126,160,.38);letter-spacing:.25em;margin-top:48px;text-transform:uppercase;
  animation:bre 4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bre{0%,100%{opacity:.18}50%{opacity:.62}}
/* §5 Progress — 1px ultra-minimal */
#prog{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;width:100px;height:1px;background:rgba(255,255,255,.05);
  transition:opacity .5s cubic-bezier(.32,.72,0,1)}
#prog div{height:100%;width:0;background:rgba(255,255,255,.22);transition:width .35s cubic-bezier(.32,.72,0,1);transform-origin:left}
#credit{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-size:9px;font-weight:500;color:rgba(150,146,190,.26);letter-spacing:.22em;text-transform:uppercase;
  transition:opacity .6s cubic-bezier(.32,.72,0,1)}
a.deerflow{position:fixed;bottom:14px;right:18px;z-index:200;font-size:9px;font-weight:500;color:rgba(150,146,190,.2);text-decoration:none;letter-spacing:.1em;
  transition:opacity .3s cubic-bezier(.32,.72,0,1)}
a.deerflow:hover{opacity:.7}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hero-wrap">
  <div id="hero-outer">
    <div id="hero-inner">
      <h1>ATMOS</h1>
      <p class="by">A Flight Experience</p>
      <p class="scroll">Scroll to begin the journey</p>
    </div>
  </div>
</div>
<div id="prog"><div></div></div>
<div id="credit">Leeroy Lab</div>
<a class="deerflow" href="https://deerflow.tech" target="_blank">✦ Deerflow</a>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ═══ SCENE ═══
const scene=new THREE.Scene();
scene.background=new THREE.Color('#080818');
scene.fog=new THREE.Fog('#080818',30,68);

// ═══ CAMERA ═══
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.15,200);
camera.position.set(0,4,16);

// ═══ RENDERER ═══
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.98;
document.body.prepend(renderer.domElement);

// ═══ SKY (Perlin noise animated gradient) ═══
const skyGeo=new THREE.SphereGeometry(58,80,80);
const skyMat=new THREE.ShaderMaterial({uniforms:{
  t:{value:0},A:{value:new THREE.Color('#1a2848')},B:{value:new THREE.Color('#463868')},
  C:{value:new THREE.Color('#b094a8')},D:{value:new THREE.Color('#e0cec4')}},
  vertexShader:`varying vec3 w;varying vec2 u;void main(){vec4 p=modelMatrix*vec4(position,1.);w=p.xyz;u=uv;gl_Position=projectionMatrix*viewMatrix*p;}`,
  fragmentShader:`varying vec3 w;varying vec2 u;uniform float t;uniform vec3 A,B,C,D;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    void main(){float y=normalize(w).y;float r=n(vec2(y*3.6+t*.01,u.x*4.2+t*.005))*.2;
      float s=smoothstep(-.3,2.5,y+r);vec3 col=mix(A,B,smoothstep(-.05,.6,s));
      col=mix(col,C,smoothstep(.35,.92,s));col=mix(col,D,smoothstep(.72,1.35,s));gl_FragColor=vec4(col,1.);}`});
const skySphere=new THREE.Mesh(skyGeo,skyMat);
skySphere.material.side=THREE.BackSide;skySphere.renderOrder=-1;scene.add(skySphere);

// ═══ LIGHT ═══
const hemi=new THREE.HemisphereLight('#8899cc','#3a3a5e',.6);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffe8d0',.85);sun.position.set(4,8,3);scene.add(sun);
scene.add(new THREE.AmbientLight('#222244',.5));

// ═══ CLOUDS ═══
const clouds=new THREE.Group();scene.add(clouds);
function cloud(x,y,z,s){
  const g=new THREE.Group();const n=5+Math.floor(Math.random()*16);
  for(let i=0;i<n;i++){
    const r=.32+Math.random()*1.7;
    const m=new THREE.MeshStandardMaterial({roughness:.58,metalness:0,color:new THREE.Color().setHSL(.62+Math.random()*.18,.06+Math.random()*.14,.66+Math.random()*.28)});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m).translate((Math.random()-.5)*3.6,(Math.random()-.5)*1.9,(Math.random()-.5)*3.1));
  }
  g.position.set(x,y,z);g.scale.setScalar(s);clouds.add(g);
}
for(let i=0;i<68;i++){const t=i/68;cloud((Math.random()-.5)*80,1+Math.random()*16,-9+t*54+(Math.random()-.5)*30,.3+Math.random()*3.2);}

// ═══ AIRCRAFT ═══
const plane=new THREE.Group();
plane.add(new THREE.Mesh(new THREE.CapsuleGeometry(.25,1.5,8,14),new THREE.MeshStandardMaterial({color:'#e8e2f0',roughness:.2,metalness:.52})).rotateX(Math.PI/2));
plane.add(new THREE.Mesh(new THREE.BoxGeometry(3.2,.04,.62),new THREE.MeshStandardMaterial({color:'#d8d2e8',roughness:.2,metalness:.42})).translate(0,-.02,0));
plane.add(new THREE.Mesh(new THREE.BoxGeometry(.62,.028,.34),new THREE.MeshStandardMaterial({color:'#d8d2e8',roughness:.2,metalness:.42})).translate(0,-.1,-.58));
plane.add(new THREE.Mesh(new THREE.BoxGeometry(.035,.42,.34),new THREE.MeshStandardMaterial({color:'#d8d2e8',roughness:.2,metalness:.42})).translate(0,.2,-.48));
const glow=new THREE.PointLight('#ffe8d0',.65,3);glow.position.set(0,-.02,-.62);plane.add(glow);
plane.position.set(0,3.5,5);plane.rotation.set(0,0,-.025);scene.add(plane);

// ═══ WIND (InstancedMesh) ═══
const N=1400,pGeo=new THREE.SphereGeometry(.025,4,2),pMat=new THREE.MeshBasicMaterial({color:'#fff',transparent:true,opacity:0});
const wind=new THREE.InstancedMesh(pGeo,pMat,N);
const dummy=new THREE.Object3D(),wData=[];
for(let i=0;i<N;i++){dummy.position.set((Math.random()-.5)*42,Math.random()*18,(Math.random()-.5)*42);dummy.updateMatrix();wind.setMatrixAt(i,dummy.matrix);wData.push({s:.3+Math.random()*2.5,x:dummy.position.x,y:dummy.position.y,z:dummy.position.z});}
scene.add(wind);

// ═══ SPLINE ═══
const curve=new THREE.CatmullRomCurve3([[0,3.5,18],[4,6.5,11],[-6,8,4],[7,5.5,-4],[-5,9,-12],[6,6.5,-21],[-7,8,-29],[5,5.5,-38],[0,7,-50]].map(([x,y,z])=>new THREE.Vector3(x,y,z)));

// ═══ TEXT PANELS ═══
const panels=[];
function panel(text,sub,pt){
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;
  const ctx=cv.getContext('2d');if(!ctx)return;
  ctx.fillStyle='rgba(240,236,255,.86)';ctx.font='400 34px Syne,sans-serif';ctx.textAlign='center';ctx.fillText(text,256,44);
  ctx.fillStyle='rgba(180,176,210,.48)';ctx.font='400 14px Syne,sans-serif';ctx.fillText(sub,256,74);
  const tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;
  const m=new THREE.MeshBasicMaterial({map:tx,transparent:true,side:THREE.DoubleSide,depthWrite:false});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(8,2),m);
  const pos=curve.getPointAt(pt);p.position.copy(pos).add(new THREE.Vector3(7.5,2,0));scene.add(p);panels.push(p);
}
panel('DEPARTURE','The journey begins',.015);
panel('ASCENDING','Through layered clouds',.18);
panel('DRIFTING','Lost in the gradient sky',.4);
panel('DESCENDING','Gently returning',.66);
panel('ARRIVAL','Thank you for flying with us',.92);

// ═══ SCROLL ENGINE (GSAP quickTo for camera) ═══
let progress=0,target=0,vel=0,last=0;
const SENSE=.0045;

window.addEventListener('wheel',e=>{e.preventDefault();target=Math.max(0,Math.min(1,target+e.deltaY*SENSE));vel=Math.abs(e.deltaY);last=performance.now()},{passive:false});
window.addEventListener('click',()=>{target=Math.min(1,target+.045);vel=55;last=performance.now()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){target=Math.min(1,target+.035);vel=55;last=performance.now()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){target=Math.max(0,target-.035);vel=55;last=performance.now()}});
let ts=0;window.addEventListener('touchstart',e=>{ts=e.touches[0].clientY},{passive:false});
window.addEventListener('touchmove',e=>{e.preventDefault();const dy=ts-e.touches[0].clientY;target=Math.max(0,Math.min(1,target+dy*.008));vel=Math.abs(dy);last=performance.now();ts=e.touches[0].clientY},{passive:false});

// GSAP: quickTo for smooth camera interpolation
let camX=null,camY=null,camZ=null;

// ═══ LOOP ═══
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.12),now=performance.now()*.001;
  // Smooth (custom cubic-bezier-like exponential decay)
  progress+=(target-progress)*Math.min(3.8*dt,1);
  if(now*1000-last>220)vel*=.82;
  // Camera — GSAP quickTo for butter-smooth interpolation
  const pt=curve.getPointAt(progress),tan=curve.getTangentAt(progress).normalize();
  if(!camX){camX=gsap.quickTo(camera.position,'x',{duration:.35,ease:'power3.out'});camY=gsap.quickTo(camera.position,'y',{duration:.35,ease:'power3.out'});camZ=gsap.quickTo(camera.position,'z',{duration:.35,ease:'power3.out'});}
  camX(pt.x);camY(pt.y+2);camZ(pt.z+8);
  camera.lookAt(pt.x+tan.x*12,pt.y+1.5+tan.y*8,pt.z+tan.z*12);
  // Plane
  const pp=curve.getPointAt(Math.min(1,progress+.035)),ptan=curve.getTangentAt(Math.min(1,progress+.035)).normalize();
  plane.position.lerp(new THREE.Vector3(pp.x,pp.y+.7,pp.z-2.2),3.8*dt);
  plane.rotation.z+=(-ptan.x*.4-plane.rotation.z)*2.5*dt;
  plane.rotation.x+=(-ptan.y*.16-plane.rotation.x)*2*dt;
  // Sky
  skyMat.uniforms.t.value=now;
  // Hemisphere
  hemi.color.setHSL(.58+progress*.15,.2,.44+progress*.38);hemi.intensity=.48+progress*.42;
  // Wind
  pMat.opacity=Math.min(.4,vel*.0015);
  for(let i=0;i<N;i++){const d=wData[i];dummy.position.set(d.x+(now*15*d.s)%42-21,d.y,d.z+(now*22*d.s)%42-21);dummy.updateMatrix();wind.setMatrixAt(i,dummy.matrix)}
  wind.instanceMatrix.needsUpdate=true;
  // Clouds
  clouds.children.forEach((c,i)=>{c.position.x+=Math.sin(now*.2+i)*.0018;c.position.y+=Math.cos(now*.15+i)*.0014});
  // Panels face camera
  panels.forEach(p=>{const dir=new THREE.Vector3().subVectors(camera.position,p.position).normalize();p.lookAt(camera.position.x+dir.x,camera.position.y+dir.y,camera.position.z+dir.z)});
  // UI
  const el=document.getElementById('hero-wrap'),cr=document.getElementById('credit');
  if(el)el.style.opacity=Math.max(0,1-progress*6);
  if(cr)cr.style.opacity=Math.min(1,progress*5);
  const bar=document.querySelector('#prog div');if(bar)bar.style.width=Math.round(progress*100)+'%';
  renderer.render(scene,camera);
}
loop();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// §7 Accessibility
if(matchMedia('(prefers-reduced-motion:reduce)').matches){document.getElementById('hero-wrap').style.transition='none';document.getElementById('hero-wrap').style.opacity='0'}
</script>
</body>
</html>
