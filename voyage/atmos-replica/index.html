<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMOS — A Flight Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080818;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Syne',sans-serif;font-weight:400;cursor:crosshair}
canvas{position:fixed;inset:0;z-index:0;display:block}
/* Grain — fixed overlay, per high-end-visual-design §6 */
body::after{content:'';position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
/* Vignette */
#vignette{position:fixed;inset:0;z-index:49;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(4,4,16,0.6) 100%)}
/* Title — cinematic minimal */
#hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;pointer-events:none;
  transition:opacity 0.8s cubic-bezier(0.32,0.72,0,1)}
#hero h1{font-size:clamp(52px,13vw,150px);font-weight:500;color:rgba(240,236,255,0.9);letter-spacing:0.16em;text-transform:uppercase}
#hero .by{font-size:11px;font-weight:500;color:rgba(180,176,210,0.5);letter-spacing:0.32em;margin-top:10px;text-transform:uppercase}
#hero .scroll{font-size:10px;font-weight:400;color:rgba(130,126,160,0.4);letter-spacing:0.25em;margin-top:56px;text-transform:uppercase;animation:bre 3.8s cubic-bezier(0.45,0,0.55,1) infinite}
@keyframes bre{0%,100%{opacity:0.2}50%{opacity:0.65}}
/* Progress — ultra-minimal */
#prog{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;width:100px;height:1px;background:rgba(255,255,255,0.06);
  transition:opacity 0.5s cubic-bezier(0.32,0.72,0,1)}
#prog div{height:100%;width:0;background:rgba(255,255,255,0.25);transition:width 0.35s cubic-bezier(0.32,0.72,0,1)}
#credit{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-size:9px;font-weight:500;color:rgba(150,146,190,0.28);letter-spacing:0.22em;text-transform:uppercase;transition:opacity 0.6s cubic-bezier(0.32,0.72,0,1)}
#deerflow{position:fixed;bottom:14px;right:18px;z-index:200;font-size:9px;font-weight:500;color:rgba(150,146,190,0.22);text-decoration:none;letter-spacing:0.1em;transition:opacity 0.3s}
#deerflow:hover{opacity:0.7}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hero"><h1>ATMOS</h1><p class="by">A Flight Experience</p><p class="scroll">Scroll to begin the journey</p></div>
<div id="prog"><div></div></div>
<div id="credit">Leeroy Lab</div>
<a id="deerflow" href="https://deerflow.tech" target="_blank">DF</a>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ═══ SCENE ═══
const scene=new THREE.Scene();
scene.background=new THREE.Color('#080818');
scene.fog=new THREE.Fog('#080818',30,70);

// ═══ CAMERA ═══
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.2,200);
camera.position.set(0,4,15);

// ═══ RENDERER ═══
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
document.body.prepend(renderer.domElement);

// ═══ SKY — inward sphere, Perlin noise animated gradient ═══
const skyGeo=new THREE.SphereGeometry(60,80,80);
const skyMat=new THREE.ShaderMaterial({uniforms:{
  t:{value:0},a:{value:new THREE.Color('#1e2a4a')},b:{value:new THREE.Color('#4a3a6a')},
  c:{value:new THREE.Color('#b898a8')},d:{value:new THREE.Color('#e0d0c8')}},
  vertexShader:`varying vec3 w;varying vec2 u;void main(){vec4 p=modelMatrix*vec4(position,1.);w=p.xyz;u=uv;gl_Position=projectionMatrix*viewMatrix*p;}`,
  fragmentShader:`varying vec3 w;varying vec2 u;uniform float t;uniform vec3 a,b,c,d;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    void main(){float y=normalize(w).y;float r=n(vec2(y*3.8+t*.012,u.x*4.5+t*.006))*.22;
      float g=smoothstep(-.4,2.4,y+r);vec3 col=mix(a,b,smoothstep(-.1,.55,g));
      col=mix(col,c,smoothstep(.3,.9,g));col=mix(col,d,smoothstep(.7,1.3,g));gl_FragColor=vec4(col,1.);}`});
const skySphere=new THREE.Mesh(skyGeo,skyMat);
skySphere.material.side=THREE.BackSide;skySphere.renderOrder=-1;scene.add(skySphere);

// ═══ LIGHT ═══
const hemi=new THREE.HemisphereLight('#8899cc','#3a3a5c',0.65);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffe8d0',0.9);sun.position.set(4,8,3);scene.add(sun);
scene.add(new THREE.AmbientLight('#222244',0.55));

// ═══ CLOUDS ═══
const cloudGroup=new THREE.Group();scene.add(cloudGroup);
function cloud(x,y,z,s){
  const g=new THREE.Group();const n=5+Math.floor(Math.random()*16);
  for(let i=0;i<n;i++){
    const r=.35+Math.random()*1.8;
    const m=new THREE.MeshStandardMaterial({roughness:.6,metalness:0,color:new THREE.Color().setHSL(.63+Math.random()*.18,.07+Math.random()*.14,.68+Math.random()*.28)});
    const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);
    o.position.set((Math.random()-.5)*3.8,(Math.random()-.5)*2,(Math.random()-.5)*3.2);g.add(o);
  }
  g.position.set(x,y,z);g.scale.setScalar(s);cloudGroup.add(g);
}
for(let i=0;i<64;i++){const t=i/64;cloud((Math.random()-.5)*75,1+Math.random()*15,-8+t*52+(Math.random()-.5)*28,.35+Math.random()*3);}

// ═══ AIRCRAFT ═══
const plane=new THREE.Group();
const fuselage=new THREE.Mesh(new THREE.CapsuleGeometry(.26,1.4,8,14),new THREE.MeshStandardMaterial({color:'#e8e2f0',roughness:.22,metalness:.5}));
fuselage.rotation.x=Math.PI/2;plane.add(fuselage);
const wing=new THREE.Mesh(new THREE.BoxGeometry(3,0.045,0.6),new THREE.MeshStandardMaterial({color:'#d8d2e8',roughness:.22,metalness:.4}));
wing.position.set(0,-.03,0);plane.add(wing);
const th=new THREE.Mesh(new THREE.BoxGeometry(.6,.03,.32),new THREE.MeshStandardMaterial({color:'#d8d2e8',roughness:.22,metalness:.4}));
th.position.set(0,-.1,-.55);plane.add(th);
const tv=new THREE.Mesh(new THREE.BoxGeometry(.04,.4,.32),new THREE.MeshStandardMaterial({color:'#d8d2e8',roughness:.22,metalness:.4}));
tv.position.set(0,.2,-.45);plane.add(tv);
const glow=new THREE.PointLight('#ffe8d0',.7,3);glow.position.set(0,-.03,-.6);plane.add(glow);
plane.position.set(0,3.5,4);plane.rotation.set(0,0,-.03);scene.add(plane);

// ═══ WIND (InstancedMesh) ═══
const N=1200,pGeo=new THREE.SphereGeometry(.03,4,2),pMat=new THREE.MeshBasicMaterial({color:'#fff',transparent:true,opacity:0});
const wind=new THREE.InstancedMesh(pGeo,pMat,N);
const dummy=new THREE.Object3D(),wData=[];
for(let i=0;i<N;i++){dummy.position.set((Math.random()-.5)*40,Math.random()*18,(Math.random()-.5)*40);dummy.updateMatrix();wind.setMatrixAt(i,dummy.matrix);wData.push({s:.35+Math.random()*2.4,x:dummy.position.x,y:dummy.position.y,z:dummy.position.z});}
scene.add(wind);

// ═══ SPLINE ═══
const curve=new THREE.CatmullRomCurve3([[0,3.5,16],[3,6,10],[-5,7.5,3],[6,5.5,-5],[-4,8.5,-13],[5,6,-22],[-6,7.5,-30],[4,5.5,-39],[0,6.5,-50]].map(([x,y,z])=>new THREE.Vector3(x,y,z)));

// ═══ TEXT PANELS ═══
const panels=[];
function panel(text,sub,pt){
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;
  const ctx=cv.getContext('2d');if(!ctx)return;
  ctx.fillStyle='rgba(240,236,255,.88)';ctx.font='400 34px Syne,sans-serif';ctx.textAlign='center';ctx.fillText(text,256,44);
  ctx.fillStyle='rgba(180,176,210,.5)';ctx.font='400 14px Syne,sans-serif';ctx.fillText(sub,256,74);
  const tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;
  const m=new THREE.MeshBasicMaterial({map:tx,transparent:true,side:THREE.DoubleSide,depthWrite:false});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(7.5,1.9),m);
  const pos=curve.getPointAt(pt);p.position.copy(pos).add(new THREE.Vector3(7,1.8,0));scene.add(p);panels.push(p);
}
panel('DEPARTURE','The journey begins',.02);
panel('ASCENDING','Through layered clouds',.2);
panel('DRIFTING','Lost in the gradient sky',.42);
panel('DESCENDING','Gently returning',.68);
panel('ARRIVAL','Thank you for flying with us',.93);

// ═══ SCROLL ENGINE ═══
let progress=0,target=0,vel=0,last=0;
const SMOOTH=3.5,SENS=.004;

window.addEventListener('wheel',e=>{e.preventDefault();target=Math.max(0,Math.min(1,target+e.deltaY*SENS));vel=Math.abs(e.deltaY);last=performance.now()},{passive:false});
window.addEventListener('click',()=>{target=Math.min(1,target+.04);vel=50;last=performance.now()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){target=Math.min(1,target+.03);vel=50;last=performance.now()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){target=Math.max(0,target-.03);vel=50;last=performance.now()}});
let ts=0;window.addEventListener('touchstart',e=>{ts=e.touches[0].clientY},{passive:false});
window.addEventListener('touchmove',e=>{e.preventDefault();const dy=ts-e.touches[0].clientY;target=Math.max(0,Math.min(1,target+dy*.007));vel=Math.abs(dy);last=performance.now();ts=e.touches[0].clientY},{passive:false});

// ═══ LOOP ═══
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.12),now=performance.now()*.001;
  // Smooth
  progress+=(target-progress)*Math.min(SMOOTH*dt,1);
  if(now*1000-last>200)vel*=.85;
  // Camera
  const pt=curve.getPointAt(progress),tan=curve.getTangentAt(progress).normalize();
  camera.position.lerp(new THREE.Vector3(pt.x,pt.y+2,pt.z+8),2.8*dt);
  camera.lookAt(pt.x+tan.x*12,pt.y+1.5+tan.y*8,pt.z+tan.z*12);
  // Plane
  const pp=curve.getPointAt(Math.min(1,progress+.03)),ptan=curve.getTangentAt(Math.min(1,progress+.03)).normalize();
  plane.position.lerp(new THREE.Vector3(pp.x,pp.y+.7,pp.z-2),3.5*dt);
  plane.rotation.z+=(-ptan.x*.38-plane.rotation.z)*2.5*dt;
  plane.rotation.x+=(-ptan.y*.15-plane.rotation.x)*2*dt;
  // Sky
  skyMat.uniforms.t.value=now;
  // Hemisphere
  hemi.color.setHSL(.6+progress*.14,.22,.45+progress*.35);hemi.intensity=.5+progress*.4;
  // Wind
  pMat.opacity=Math.min(.45,vel*.0016);
  for(let i=0;i<N;i++){const d=wData[i];dummy.position.set(d.x+(now*14*d.s)%40-20,d.y,d.z+(now*20*d.s)%40-20);dummy.updateMatrix();wind.setMatrixAt(i,dummy.matrix)}
  wind.instanceMatrix.needsUpdate=true;
  // Clouds
  cloudGroup.children.forEach((c,i)=>{c.position.x+=Math.sin(now*.22+i)*.002;c.position.y+=Math.cos(now*.16+i)*.0015});
  // Panels face camera
  panels.forEach(p=>p.lookAt(camera.position));
  // UI
  const el=document.getElementById('hero'),cr=document.getElementById('credit'),pg=document.getElementById('prog');
  if(el)el.style.opacity=Math.max(0,1-progress*5.5);
  if(cr)cr.style.opacity=Math.min(1,progress*4.5);
  const bar=document.querySelector('#prog div');if(bar)bar.style.width=Math.round(progress*100)+'%';
  renderer.render(scene,camera);
}
loop();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// Reduced motion
if(matchMedia('(prefers-reduced-motion:reduce)').matches){const el=document.getElementById('hero');if(el){el.style.opacity='0';el.style.transition='none'}}
</script>
</body>
</html>
