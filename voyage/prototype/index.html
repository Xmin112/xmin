<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#FF6B6B;--gold:#FFD93D;--ui-bg:#FFFDF5;--t1:#4A3728;--t2:#8B7A68;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Gaegu',cursive;}
canvas{display:block;}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:999;background:#000;transition:opacity 1s;pointer-events:none;}
#load.hide{opacity:0;}
#load span{color:#FFFDF5;font-size:28px;font-family:'Gaegu',cursive;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
#input-wrap{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:6px;}
#input-wrap.show{display:flex;}
#city-in{background:var(--ui-bg);border:1.5px solid #E0D5C5;border-radius:40px;padding:10px 20px;font-family:'Gaegu',cursive;font-size:18px;color:var(--t1);outline:none;width:220px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.05);transition:border-color 0.3s;}
#city-in:focus{border-color:var(--accent);}
#go-btn{margin-left:4px;background:var(--accent);color:#fff;border:none;border-radius:40px;padding:10px 22px;font-family:'Gaegu',cursive;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(255,107,107,0.25);transition:transform 0.15s;}
#go-btn:active{transform:scale(0.94);}
#go-btn:disabled{opacity:0.35;cursor:default;}
#stamp-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;cursor:pointer;background:rgba(184,204,158,0.3);backdrop-filter:blur(12px);}
#stamp-overlay.show{display:flex;}
#stamp-card{background:var(--ui-bg);border:3px solid var(--gold);border-radius:32px;padding:48px 56px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.08);}
#stamp-card .m{font-size:72px;display:block;}
#stamp-card h2{font-size:28px;font-weight:700;color:var(--t1);margin:10px 0;font-family:'Gaegu',cursive;}
#stamp-card p{font-size:15px;color:var(--t2);font-family:'Gaegu',cursive;}
#deerflow{position:fixed;bottom:10px;right:14px;z-index:200;font-size:10px;color:rgba(139,122,104,0.4);text-decoration:none;transition:opacity 0.3s;font-family:sans-serif;}
#deerflow:hover{opacity:1;}
@media(max-width:640px){#city-in{width:150px;font-size:15px;padding:8px 14px;}#go-btn{padding:8px 16px;font-size:15px;}}
</style>
</head>
<body>
<div id="load"><span>✧</span></div>
<div id="input-wrap"><input id="city-in" placeholder="城市名…" autocomplete="off"><button id="go-btn">出发</button></div>
<div id="stamp-overlay"><div id="stamp-card"><span class="m">🏅</span><h2>获得旅行印章！</h2><p>「圣水洞探索者」</p><p style="font-size:13px;margin-top:4px;color:#B8A898">集齐了全部 4 个探索地点</p></div></div>
<a id="deerflow" href="https://deerflow.tech" target="_blank">✦ Deerflow</a>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ═══ SCENE ═══
const scene=new THREE.Scene();
scene.background=new THREE.Color('#C8DCF0');
scene.fog=new THREE.Fog('#C8DCF0',28,60);

// ═══ CAMERA (Perspective) ═══
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.3,100);
// Start: close-up of tree crown
camera.position.set(0.3,3.8,3.5);
camera.lookAt(0,2.5,2);

// ═══ RENDERER ═══
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.body.prepend(renderer.domElement);

// ═══ LIGHTING ═══
scene.add(new THREE.AmbientLight('#FFF5EC',0.48));
const sun=new THREE.DirectionalLight('#FFE8D0',3);
sun.position.set(14,22,9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;
sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;sun.shadow.bias=-0.0001;
scene.add(sun);
scene.add(new THREE.HemisphereLight('#D8E8F8','#B8C89A',0.55));

// ═══ SKY PLANE ═══
const skyGeo=new THREE.PlaneGeometry(70,70);
const skyMat=new THREE.ShaderMaterial({uniforms:{t:{value:new THREE.Color('#98C0E0')},b:{value:new THREE.Color('#E8E0D0')}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying vec2 vUv;uniform vec3 t,b;void main(){gl_FragColor=vec4(mix(b,t,vUv.y),1.0);}`});
const sky=new THREE.Mesh(skyGeo,skyMat);
sky.position.set(0,13,-18);sky.rotation.x=-0.22;sky.renderOrder=-1;scene.add(sky);

// ═══ GROUND ═══
// Deeper, more saturated green (per frontend-design: "dominant colors, not timid pastels")
const ground=new THREE.Mesh(new THREE.PlaneGeometry(55,55),
  new THREE.MeshStandardMaterial({color:'#B8CC9E',roughness:0.75}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.08;ground.receiveShadow=true;scene.add(ground);

// Plaza
const plaza=new THREE.Mesh(new THREE.PlaneGeometry(5.5,5.5),
  new THREE.MeshStandardMaterial({color:'#D8CFB8',roughness:0.65}));
plaza.rotation.x=-Math.PI/2;plaza.position.set(0,-0.06,2);plaza.receiveShadow=true;scene.add(plaza);

// Dirt paths (slightly winding with more character)
const pathM=new THREE.MeshStandardMaterial({color:'#CEBF9E',roughness:0.82});
[[0,-0.05,2,0.9,13],[-2,-0.05,-1,0.6,12],[2,-0.05,-1,0.6,12]].forEach(([x,y,z,w,d])=>{
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d),pathM);
  p.rotation.x=-Math.PI/2;p.position.set(x,y,z);p.receiveShadow=true;scene.add(p);
});

// ═══ CENTERPIECE TREE (the star of the opening shot) ═══
const bigTree=new THREE.Group();bigTree.position.set(0,0,2);
// Trunk — thicker, more organic
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.6,3.5,16),
  new THREE.MeshStandardMaterial({color:'#7D5A3C',roughness:0.5}));
trunk.position.y=1.75;trunk.castShadow=true;bigTree.add(trunk);
// Multi-layered crown with varied greens
const crownColors=['#5A8A44','#65904E','#7AAA5E','#8DBB6E','#78A658'];
const leafMeshes=[];
for(let i=0;i<6;i++){
  const g=new THREE.Group();g.position.set(0,2.8+i*1.0,0);
  for(let j=0;j<8;j++){
    const r=0.4+Math.random()*0.9;
    const s=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),
      new THREE.MeshStandardMaterial({color:crownColors[Math.floor(Math.random()*5)],roughness:0.45}));
    s.position.set((Math.random()-0.5)*2.5,Math.random()*2,(Math.random()-0.5)*2.5);
    s.castShadow=true;g.add(s);leafMeshes.push(s);
  }
  bigTree.add(g);
}
// Extra canopy glow — a subtle point light inside the crown
const canopyGlow=new THREE.PointLight('#FFE8B0',1.5,8);
canopyGlow.position.y=4.5;bigTree.add(canopyGlow);
scene.add(bigTree);

// ═══ BUILDINGS (walls as separate panels for opening animation) ═══
const buildings=[];
const wallColors=['#F5EDE0','#F0E5D5','#EDE0CF','#EBDBD0','#F2E8D8'];
const roofColors=['#D4A080','#C89070','#B88060','#CC9878'];

function addBuilding(id,x,z,w,d,h,type,name,emoji){
  const g=new THREE.Group();g.position.set(x,0,z);
  const wc=type==='poi'?'#FBF3E4':type==='hidden'?'#FFF8EE':wallColors[Math.floor(Math.random()*wallColors.length)];
  const rc=type==='poi'?'#D89870':type==='hidden'?'#E8C878':roofColors[Math.floor(Math.random()*roofColors.length)];

  // 4 wall panels (can rotate out like a gift box opening)
  const panels={};
  const wallM=new THREE.MeshStandardMaterial({color:wc,roughness:0.5,metalness:0.02,side:THREE.DoubleSide});
  // Front — hinge at bottom
  const fw=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallM.clone());
  fw.position.set(0,h/2,d/2);fw.userData={hingeZ:d/2};g.add(fw);panels.front=fw;
  // Back
  const bw=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallM.clone());
  bw.position.set(0,h/2,-d/2);bw.userData={hingeZ:-d/2};g.add(bw);panels.back=bw;
  // Left
  const lw=new THREE.Mesh(new THREE.PlaneGeometry(d,h),wallM.clone());
  lw.position.set(-w/2,h/2,0);lw.rotation.y=Math.PI/2;lw.userData={hingeX:-w/2};g.add(lw);panels.left=lw;
  // Right
  const rw=new THREE.Mesh(new THREE.PlaneGeometry(d,h),wallM.clone());
  rw.position.set(w/2,h/2,0);rw.rotation.y=Math.PI/2;rw.userData={hingeX:w/2};g.add(rw);panels.right=rw;

  // Floor
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshStandardMaterial({color:'#E8DCC8',roughness:0.5}));
  floor.rotation.x=-Math.PI/2;floor.position.y=0.01;g.add(floor);

  // Roof group
  const roofG=new THREE.Group();roofG.position.y=h;
  const rMesh=new THREE.Mesh(new THREE.BoxGeometry(w+0.5,0.35,d+0.5),
    new THREE.MeshStandardMaterial({color:rc,roughness:0.35}));
  rMesh.position.y=0.18;rMesh.castShadow=true;roofG.add(rMesh);
  if(type==='poi'){
    const cone=new THREE.Mesh(new THREE.ConeGeometry(w*0.38,0.55,4),
      new THREE.MeshStandardMaterial({color:rc,roughness:0.3}));
    cone.position.y=0.62;cone.rotation.y=Math.PI/4;cone.castShadow=true;roofG.add(cone);
  }
  g.add(roofG);

  // Inner glow
  let glow=null;
  if(type==='poi'||type==='hidden'){
    glow=new THREE.PointLight('#FFD93D',0,6);
    glow.position.y=h/2;g.add(glow);
  }

  // Windows
  if(type!=='hidden'&&h>3){
    const winM=new THREE.MeshStandardMaterial({color:'#D5C8B5',roughness:0.35});
    [0.22,0.48,0.74].forEach(f=>{
      const win=new THREE.Mesh(new THREE.PlaneGeometry(w*0.45,0.14),winM);
      win.position.set(0,h*f,d/2+0.02);g.add(win);
    });
  }

  g.userData={id,type,name,emoji,w,d,h,x,z,panels,roofG,glow,opened:false};
  g.scale.set(1,0,1);scene.add(g);buildings.push(g);
}

// 4 POIs placed around plaza
addBuilding('cafe-onion',-5.5,-3,4.5,4,5.5,'poi','Cafe Onion','☕');
addBuilding('tamburins',5.5,-2.5,4,3.5,7,'poi','Tamburins','💄');
addBuilding('daelim',4.5,8,5.5,5,6,'poi','大林仓库','🎨');
addBuilding('hidden-mural',9,11,2,2,3,'hidden','秘密壁画','🌸');

// Normal buildings around plaza
for(let i=0;i<16;i++){
  const angle=(i/16)*Math.PI*2+Math.random()*0.25,dist=5.5+Math.random()*5.5;
  addBuilding('b'+i,Math.cos(angle)*dist,Math.sin(angle)*dist+1.5,
    1.5+Math.random()*2.5,2+Math.random()*2.5,1.8+Math.random()*4.5,'normal','','');
}

// ═══ ORNAMENTAL TREES ═══
const swayTrees=[];
for(let i=0;i<14;i++){
  const angle=(i/14)*Math.PI*2,dist=8.5+Math.random()*7;
  const tx=Math.cos(angle)*dist,tz=Math.sin(angle)*dist+1.2;
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.12,1.4,8),
    new THREE.MeshStandardMaterial({color:'#9B7B5A',roughness:0.65}));
  tr.position.set(tx,0.7,tz);tr.castShadow=true;scene.add(tr);
  ['#65904E','#7AAA5E'].forEach((c,j)=>{
    const cr=new THREE.Mesh(new THREE.SphereGeometry(0.45+j*0.2,10,8),
      new THREE.MeshStandardMaterial({color:c,roughness:0.5}));
    cr.position.set(tx+(j-0.5)*0.15,1.4+j*0.65,tz);cr.castShadow=true;
    cr.userData={ox:tx+(j-0.5)*0.15};scene.add(cr);swayTrees.push(cr);
  });
}

// ═══ NPCs ═══
const npcs=[];
function makeNPC(x,z,color){
  const g=new THREE.Group();g.position.set(x,0,z);
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.22,0.55,8,12),
    new THREE.MeshStandardMaterial({color,roughness:0.5}));
  body.position.y=0.42;body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.21,14,14),
    new THREE.MeshStandardMaterial({color:'#FFE8D6',roughness:0.45}));
  head.position.y=0.92;g.add(head);
  scene.add(g);npcs.push(g);
}
makeNPC(-5.5,-0.5,'#8B6B4A');
makeNPC(4.5,10,'#6B5B4A');

// ═══ PLAYER ═══
const player=new THREE.Group();player.position.set(0,0,6);
// Shadow disc
const ps=new THREE.Mesh(new THREE.CircleGeometry(0.12,16),
  new THREE.MeshBasicMaterial({color:'#000',transparent:true,opacity:0.1}));
ps.rotation.x=-Math.PI/2;ps.position.y=-0.32;player.add(ps);
// Body
const pb=new THREE.Mesh(new THREE.CapsuleGeometry(0.14,0.42,8,12),
  new THREE.MeshStandardMaterial({color:'#FFFDF8',roughness:0.3}));
pb.position.y=0.16;pb.castShadow=true;player.add(pb);
// Backpack
const bp=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.18,0.09),
  new THREE.MeshStandardMaterial({color:'#D4A88C',roughness:0.35}));
bp.position.set(0,0.3,-0.09);player.add(bp);
// Head
const ph=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,14),
  new THREE.MeshStandardMaterial({color:'#FFE8D6',roughness:0.35}));
ph.position.y=0.6;player.add(ph);
// Hat
const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.2,0.06,14),
  new THREE.MeshStandardMaterial({color:'#FF6B6B',roughness:0.25}));
hat.position.y=0.73;player.add(hat);
scene.add(player);

// ═══ ROUTE PARTICLES ═══
const routePoints=[
  [-5.5,0.6,-1],[0,0.6,2],[5.5,0.6,0],[4.5,0.6,8]
].map(([x,y,z])=>new THREE.Vector3(x,y,z));
const routeCurve=new THREE.CatmullRomCurve3(routePoints);
const routeGroup=new THREE.Group();routeGroup.visible=false;scene.add(routeGroup);
const rParticles=[];
for(let i=0;i<40;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.06,4,4),
    new THREE.MeshBasicMaterial({color:'#FFD93D',transparent:true,opacity:0}));
  s.userData={t:i*0.025,speed:0.002+Math.random()*0.006};
  routeGroup.add(s);rParticles.push(s);
}

// ═══ INTERACTION ═══
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let target=null,quickX=null,quickY=null,routeActive=false;
const discovered=new Set();

function openBuilding(bld){
  if(bld.userData.opened)return;
  bld.userData.opened=true;
  const u=bld.userData,p=u.panels,r=u.roofG,g=u.glow;
  // Roof lift + wobble
  gsap.to(r.position,{y:u.h+2.5,duration:0.75,ease:"back.out(1.6)"});
  // Glow on
  if(g)gsap.to(g,{intensity:2.5,duration:0.5});
  // Front/back walls rotate outward (hinge at bottom edge)
  gsap.to(p.front.rotation,{x:-0.45,duration:0.6,ease:"power2.out"});
  gsap.to(p.back.rotation,{x:0.45,duration:0.6,ease:"power2.out"});
  // Left/right walls
  gsap.to(p.left.rotation,{y:Math.PI/2+0.45,duration:0.6,ease:"power2.out"});
  gsap.to(p.right.rotation,{y:Math.PI/2-0.45,duration:0.6,ease:"power2.out"});
  // Move walls outward from center
  gsap.to(p.front.position,{z:u.d/2+1.8,duration:0.6,ease:"power2.out"});
  gsap.to(p.back.position,{z:-u.d/2-1.8,duration:0.6,ease:"power2.out"});
  gsap.to(p.left.position,{x:-u.w/2-1.8,duration:0.6,ease:"power2.out"});
  gsap.to(p.right.position,{x:u.w/2+1.8,duration:0.6,ease:"power2.out"});
  // Burst
  spawnBurst(new THREE.Vector3(u.x,u.h/2,u.z));
  discover(u.id);
}

function spawnBurst(pos){
  for(let i=0;i<30;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.05+Math.random()*0.07,4,4),
      new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(0.12+Math.random()*0.06,0.9,0.45+Math.random()*0.45),transparent:true}));
    s.position.copy(pos);
    const vel=new THREE.Vector3((Math.random()-0.5)*4,3+Math.random()*5,(Math.random()-0.5)*4);
    s.userData={vel,life:1};
    scene.add(s);
    gsap.to(s.userData,{life:0,duration:1.3+Math.random()*0.5,ease:"power2.out",onComplete:()=>{scene.remove(s);s.geometry.dispose();s.material.dispose();}});
    if(!window._b)window._b=[];window._b.push(s);
  }
}
window._b=[];

function discover(id){
  if(discovered.has(id))return;
  discovered.add(id);
  if(discovered.size>=4){
    setTimeout(()=>{
      document.getElementById('stamp-overlay').classList.add('show');
      gsap.from('#stamp-card',{scale:0.3,opacity:0,duration:1,ease:"elastic.out(1,0.3)"});
    },900);
  }
}

// Click handler
renderer.domElement.addEventListener('click',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(mouse,camera);

  // Check POI buildings
  for(const bld of buildings.filter(b=>b.userData.type!=='normal')){
    const objs=[];
    bld.traverse(c=>{if(c.isMesh&&c.material.color&&!c.material.isShaderMaterial)objs.push(c);});
    if(raycaster.intersectObjects(objs).length>0){openBuilding(bld);return;}
  }
  // Ground
  const gh=raycaster.intersectObject(ground);
  if(gh.length>0){target={x:gh[0].point.x,z:gh[0].point.z};}
});

// Keyboard
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

// Input
const inputWrap=document.getElementById('input-wrap');
const cityIn=document.getElementById('city-in');
const goBtn=document.getElementById('go-btn');
goBtn.addEventListener('click',()=>{
  const v=cityIn.value.trim();if(!v)return;
  routeActive=true;routeGroup.visible=true;
  // 粒子淡入 (gsap stagger)
  rParticles.forEach((p,i)=>{
    gsap.to(p.material,{opacity:0.85,duration:0.35,delay:i*0.015});
  });
  gsap.to(inputWrap,{opacity:0,y:20,duration:0.45,ease:"power2.in",
    onComplete:()=>{inputWrap.classList.remove('show');inputWrap.style.opacity='';inputWrap.style.transform='';}});
});
cityIn.addEventListener('keydown',e=>{if(e.key==='Enter')goBtn.click();});

// Stamp close
document.getElementById('stamp-overlay').addEventListener('click',function(){
  gsap.to('#stamp-card',{scale:0.8,opacity:0,duration:0.3,ease:"power2.in",
    onComplete:()=>this.classList.remove('show')});
});

// ═══ CINEMATIC OPENING (Skill-guided: GSAP timeline + onUpdate for camera.lookAt) ═══
setTimeout(()=>document.getElementById('load').classList.add('hide'),500);

const cineTL=gsap.timeline({defaults:{ease:"power3.inOut"}});

// Step 1: Hold on tree for 2.5 seconds (user studies the beautiful tree)
cineTL.to(camera.position,{x:0.3,y:3.8,z:3.5,duration:2.5,ease:"none",
  onUpdate:()=>camera.lookAt(0,2.5,2)});

// Step 2: Pull back and rise (camera reveals the world)
cineTL.to(camera.position,{x:3,y:8,z:11,duration:4.5,ease:"power3.inOut",
  onUpdate:()=>camera.lookAt(0,0,2)});

// Buildings emerge DURING pullback (stagger from center)
buildings.forEach((b,i)=>{
  const dist=Math.sqrt((b.userData.x||0)**2+((b.userData.z||0)-2)**2);
  cineTL.to(b.scale,{y:1,duration:0.45,ease:"back.out(1.7)"},1.6+dist*0.06);
});
// Big tree emerges last
bigTree.scale.set(1,0,1);
cineTL.to(bigTree.scale,{y:1,duration:0.55,ease:"back.out(1.7)"},2.0);

// Step 3: Settle + show UI
cineTL.call(()=>{
  inputWrap.classList.add('show');
  gsap.fromTo(inputWrap,{opacity:0,y:20},{opacity:1,y:0,duration:0.6,ease:"power2.out"});
  cityIn.focus();
},null,5.5);

// ═══ ANIMATION LOOP ═══
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);

  // Player movement
  const km=keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']||keys['w']||keys['a']||keys['s']||keys['d'];
  if(km){target=null;const s=5*dt;
    if(keys['ArrowUp']||keys['w']){player.position.z-=s;player.rotation.y=Math.PI;}
    if(keys['ArrowDown']||keys['s']){player.position.z+=s;player.rotation.y=0;}
    if(keys['ArrowLeft']||keys['a']){player.position.x-=s;player.rotation.y=Math.PI/2;}
    if(keys['ArrowRight']||keys['d']){player.position.x+=s;player.rotation.y=-Math.PI/2;}
    player.position.y=Math.abs(Math.sin(Date.now()*0.017))*0.04;
  }else if(target){
    if(!quickX){quickX=gsap.quickTo(player.position,"x",{duration:0.3,ease:"power2.out"});quickY=gsap.quickTo(player.position,"z",{duration:0.3,ease:"power2.out"});}
    const dx=target.x-player.position.x,dz=target.z-player.position.z;
    if(Math.sqrt(dx*dx+dz*dz)<0.25){target=null;player.position.y=0;quickX=quickY=null;}
    else{quickX(target.x);quickY(target.z);player.position.y=Math.abs(Math.sin(Date.now()*0.017))*0.04;player.rotation.y=Math.atan2(dx,dz);}
  }

  // Route particles
  if(routeActive){rParticles.forEach(p=>{p.userData.t+=p.userData.speed;if(p.userData.t>1)p.userData.t-=1;p.position.copy(routeCurve.getPointAt(p.userData.t));});}

  // Tree sway
  swayTrees.forEach((t,i)=>{t.position.x=t.userData.ox+Math.sin(Date.now()*0.002+i)*0.04;});
  leafMeshes.forEach((l,i)=>{l.position.x+=Math.sin(Date.now()*0.0018+i)*0.03;l.position.z+=Math.cos(Date.now()*0.002+i)*0.025;});

  // NPC bob
  npcs.forEach((n,i)=>{n.position.y=Math.sin(Date.now()*0.003+i)*0.03;});

  // Burst particles
  if(window._b){window._b.forEach(p=>{p.position.x+=p.userData.vel.x*dt;p.position.y+=p.userData.vel.y*dt;p.position.z+=p.userData.vel.z*dt;p.userData.vel.y-=3.5*dt;p.material.opacity=p.userData.life;});}

  // Sun breathe
  sun.position.x=14+Math.sin(Date.now()*0.0003)*2;

  renderer.render(scene,camera);
}
animate();

// ═══ RESIZE ═══
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ═══ REDUCED MOTION ═══
if(matchMedia('(prefers-reduced-motion:reduce)').matches){buildings.forEach(b=>b.scale.set(1,1,1));bigTree.scale.set(1,1,1);camera.position.set(3,8,11);camera.lookAt(0,0,2);inputWrap.classList.add('show');}

console.log('🌍 Voyage');
</script>
</body>
</html>
