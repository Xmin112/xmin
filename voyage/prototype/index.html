<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage — 圣水洞</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#F5EDE0; font-family:'Nunito',sans-serif; cursor:crosshair; }
  canvas { display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #counter { position:absolute; top:20px; left:50%; transform:translateX(-50%);
    background:rgba(255,253,245,0.85); backdrop-filter:blur(8px);
    border:1.5px solid #E0D5C5; border-radius:40px; padding:8px 18px;
    display:flex; align-items:center; gap:8px; font-size:14px; color:#4A3728;
    box-shadow:0 2px 12px rgba(0,0,0,0.04); }
  #stamp-overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(245,237,224,0.6); backdrop-filter:blur(4px); z-index:100; cursor:pointer; }
  #stamp-overlay.show { display:flex; }
  #stamp-card { background:#FFFDF5; border:2px solid #FFD93D; border-radius:28px;
    padding:40px 48px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.1);
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from { transform:scale(0.7); opacity:0; } to { transform:scale(1); opacity:1; } }
  #stamp-card h2 { font-size:22px; font-weight:800; color:#4A3728; margin:16px 0 8px; }
  #stamp-card p { font-size:14px; color:#8B7A68; }
  #stamp-card .medal { font-size:56px; }
  #hint { position:absolute; top:80px; left:50%; transform:translateX(-50%);
    background:rgba(255,253,245,0.8); border:1px solid #E0D5C5; border-radius:20px;
    padding:8px 18px; font-size:13px; color:#8B7A68; opacity:1; transition:opacity 0.5s; }
  #hint.fade { opacity:0; }
</style>
</head>
<body>
<div id="ui">
  <div id="counter"><span id="counter-icon">🧭</span><span id="counter-text">0/4 已探索</span></div>
  <div id="hint">👆 点击建筑物来探索圣水洞</div>
</div>
<div id="stamp-overlay" onclick="this.classList.remove('show')">
  <div id="stamp-card">
    <div class="medal">🏅</div>
    <h2>获得旅行印章！</h2>
    <p>「圣水洞探索者」</p>
    <p style="font-size:12px;margin-top:4px;color:#B8A898">集齐了圣水洞全部 4 个探索地点</p>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

// ══════════════ SCENE ══════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color('#F5EDE0');
scene.fog = new THREE.Fog('#F5EDE0', 30, 80);

// ══════════════ CAMERA ══════════════
const aspect = window.innerWidth / window.innerHeight;
const size = 22;
const camera = new THREE.OrthographicCamera(-size*aspect, size*aspect, size, -size, 0.1, 120);
camera.position.set(9, 19, 13);
camera.lookAt(0, 0, 1);

// ══════════════ RENDERER ══════════════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

// ══════════════ LIGHTING ══════════════
scene.add(new THREE.AmbientLight('#FFF5EC', 0.6));
const sun = new THREE.DirectionalLight('#FFE4CC', 2.2);
sun.position.set(20, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.0001;
scene.add(sun);
scene.add(new THREE.HemisphereLight('#FFECD2', '#C8B898', 0.5));
const fill = new THREE.DirectionalLight('#FFECD2', 0.4);
fill.position.set(-10, 5, -10);
scene.add(fill);

// ══════════════ GROUND ══════════════
const groundMat = new THREE.MeshStandardMaterial({ color:'#F5EDE0', roughness:0.85 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.08; ground.receiveShadow = true;
scene.add(ground);

// Roads
const roadMat = new THREE.MeshStandardMaterial({ color:'#EBE0D0', roughness:0.9 });
[[-3.5,0,-2,0.8,28], [1.5,0,-2,0.8,28], [-9,0,-7,28,0.7], [-9,0,3,28,0.7], [-9,0,8,28,0.7]].forEach(([x,y,z,w,d]) => {
  const r = new THREE.Mesh(new THREE.PlaneGeometry(w,d), roadMat);
  r.rotation.x = -Math.PI/2; r.position.set(x,-0.04,z); r.receiveShadow = true;
  scene.add(r);
});

// Sidewalks
const swMat = new THREE.MeshStandardMaterial({ color:'#F8F2E8', roughness:0.8 });
[[-6,0,-1.5,3,11],[4,0,-1.5,3,13]].forEach(([x,y,z,w,d]) => {
  const s = new THREE.Mesh(new THREE.PlaneGeometry(w,d), swMat);
  s.rotation.x = -Math.PI/2; s.position.set(x,-0.06,z); s.receiveShadow = true;
  scene.add(s);
});

// ══════════════ BUILDINGS ══════════════
const buildings = [];
const wallColors = ['#F8F2EA','#F3EDE3','#EDE6DA','#E8DFCF','#F0E8DC','#EEE5D5'];
const roofColors = ['#C4A882','#B89878','#A88868','#BBA080','#C8B090'];

function addBuilding(id, x, z, w, d, h, type, name) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.userData = { id, type, name, w, d, h, x, z };

  // Wall
  const wallColor = type==='poi' ? '#F6E8D8' : type==='hidden' ? '#FFF8EE' : wallColors[Math.floor(Math.random()*wallColors.length)];
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color:wallColor, roughness:0.6, metalness:0.02,
      emissive:type==='hidden'?'#FFD93D':'#000', emissiveIntensity:type==='hidden'?0.1:0 })
  );
  wall.position.y = h/2; wall.castShadow = true; wall.receiveShadow = true;
  group.add(wall);

  // Roof
  const roofColor = type==='poi' ? '#D4A88C' : type==='hidden' ? '#E8C878' : roofColors[Math.floor(Math.random()*roofColors.length)];
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.4, 0.5, d+0.4),
    new THREE.MeshStandardMaterial({ color:roofColor, roughness:0.5 }));
  roof.position.y = h + 0.25; roof.castShadow = true;
  group.add(roof);

  // Pointed roof for POIs
  if (type === 'poi') {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(w*0.5, 0.8, 4),
      new THREE.MeshStandardMaterial({ color:roofColor, roughness:0.4 }));
    cone.position.y = h + 0.8; cone.rotation.y = Math.PI/4; cone.castShadow = true;
    group.add(cone);
  }

  // Windows
  if (type !== 'hidden' && h > 3) {
    const winMat = new THREE.MeshStandardMaterial({ color:'#D5C8B5', roughness:0.4 });
    for (const frac of [0.3, 0.55, 0.8]) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(w*0.6, 0.22), winMat);
      win.position.set(0, h*frac, d/2+0.02); group.add(win);
    }
  }

  // Flag for POI
  if (type === 'poi') {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.2),
      new THREE.MeshStandardMaterial({ color:'#5C4A3A', roughness:0.4 }));
    pole.position.set(0, h+1.3, 0); group.add(pole);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.3),
      new THREE.MeshStandardMaterial({ color:'#FF6B6B', roughness:0.3, side:THREE.DoubleSide }));
    flag.position.set(0.25, h+1.7, 0); flag.rotation.set(0,0,0.15); group.add(flag);
  }

  // Hidden glow
  if (type === 'hidden') {
    const glow = new THREE.PointLight('#FFD93D', 1.5, 5);
    glow.position.y = h + 2; group.add(glow);
  }

  scene.add(group);
  buildings.push(group);
}

// POIs
addBuilding('cafe-onion', -6, -5, 4.5, 4, 5.5, 'poi', 'Cafe Onion');
addBuilding('tamburins', 5, -4, 4, 3.5, 7, 'poi', 'Tamburins');
addBuilding('daelim', 4, 7, 5.5, 5, 6, 'poi', '大林仓库');
addBuilding('hidden-mural', 9, 12, 2, 1.8, 3, 'hidden', '秘密壁画');
// Normal buildings
for (let i = 0; i < 22; i++) {
  const gx = (i%6)-2.5, gz = Math.floor(i/6)-1.5;
  addBuilding('b'+i, gx*3.4+(Math.random()-0.5)*1.2, -11+gz*5.5+(Math.random()-0.5)*1.8,
    1.5+Math.random()*2.5, 2+Math.random()*2.5, 1.8+Math.random()*4.5, 'normal', '');
}

// ══════════════ TREES ══════════════
const treePositions = [[-10,-10],[-10,-6],[-10,10],[10,-8],[10,3],[-6,13],[0,14],[-3,-14],[-8,6],[10,-12],[-11,2],[11,8],[7,-13],[-4,11]];
treePositions.forEach(([x,z]) => {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,1.4,8),
    new THREE.MeshStandardMaterial({ color:'#A08568', roughness:0.7 }));
  trunk.position.set(x,0.7,z); trunk.castShadow = true; scene.add(trunk);
  const crownColors = ['#7BA869','#6B9659','#8DBB78'];
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(0.7,10,8),
    new THREE.MeshStandardMaterial({ color:crownColors[Math.floor(Math.random()*3)], roughness:0.6 }));
  c1.position.set(x,1.6,z); c1.castShadow = true; scene.add(c1);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.45,8,6),
    new THREE.MeshStandardMaterial({ color:crownColors[Math.floor(Math.random()*3)], roughness:0.6 }));
  c2.position.set(x+0.3,1.3,z+0.2); scene.add(c2);
  const c3 = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,6),
    new THREE.MeshStandardMaterial({ color:crownColors[Math.floor(Math.random()*3)], roughness:0.6 }));
  c3.position.set(x-0.25,1.4,z-0.15); scene.add(c3);
});

// Bushes
for (let i=0;i<12;i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.35+Math.random()*0.2,8,6),
    new THREE.MeshStandardMaterial({ color:i%3===0?'#A8C898':'#8DB580', roughness:0.55 }));
  b.position.set(-9+i*1.8,0.25,-13.5+(i%3)*5); b.castShadow = true; scene.add(b);
}

// ══════════════ NPCs ══════════════
const npcs = [];
function addNPC(x, z, color) {
  const g = new THREE.Group(); g.position.set(x,0,z);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3,0.7,8,12),
    new THREE.MeshStandardMaterial({ color, roughness:0.5 }));
  body.position.y = 0.5; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28,14,14),
    new THREE.MeshStandardMaterial({ color:'#FFE8D6', roughness:0.45 }));
  head.position.y = 1.1; g.add(head);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),
    new THREE.MeshBasicMaterial({ color:'#FF6B6B' }));
  dot.position.y = 1.7; g.add(dot);
  scene.add(g); npcs.push(g);
}
addNPC(-6, -2, '#8B6B4A');
addNPC(4, 10, '#6B5B4A');

// ══════════════ PLAYER ══════════════
const player = new THREE.Group();
player.position.set(-9, 0, -13);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.16,16),
  new THREE.MeshBasicMaterial({ color:'#000', transparent:true, opacity:0.1 }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = -0.38; player.add(shadow);
const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.18,0.5,8,12),
  new THREE.MeshStandardMaterial({ color:'#FFFDF8', roughness:0.35 }));
pBody.position.y = 0.2; pBody.castShadow = true; player.add(pBody);
const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.25,0.12),
  new THREE.MeshStandardMaterial({ color:'#D4A88C', roughness:0.4 }));
backpack.position.set(0,0.35,-0.14); player.add(backpack);
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.22,14,14),
  new THREE.MeshStandardMaterial({ color:'#FFE8D6', roughness:0.4 }));
pHead.position.y = 0.75; player.add(pHead);
const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.25,0.08,14),
  new THREE.MeshStandardMaterial({ color:'#FF6B6B', roughness:0.3 }));
hat.position.y = 0.9; player.add(hat);
scene.add(player);

// ══════════════ RAYCASTING ══════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let target = null;
const discovered = new Set();

// ══════════════ GAME STATE ══════════════
function discover(id) {
  if (discovered.has(id)) return;
  discovered.add(id);
  document.getElementById('counter-text').textContent = `${discovered.size}/4 已探索`;
  if (discovered.size >= 4) {
    document.getElementById('counter-icon').textContent = '🏅';
    setTimeout(() => document.getElementById('stamp-overlay').classList.add('show'), 600);
  }
  // Hide hint after first discovery
  if (discovered.size === 1) document.getElementById('hint').classList.add('fade');
}

// ══════════════ CLICK HANDLER ══════════════
renderer.domElement.addEventListener('click', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);

  // Check buildings
  const bMeshes = buildings.map(b => b.children[0]); // wall mesh
  const hits = raycaster.intersectObjects(bMeshes);
  if (hits.length > 0) {
    const bld = buildings.find(b => b.children[0] === hits[0].object);
    if (bld && bld.userData.type !== 'normal') {
      target = { x: bld.userData.x, z: bld.userData.z + bld.userData.d/2 + 0.6 };
      // Auto-discover after arrival
      setTimeout(() => discover(bld.userData.id), 1400);
      return;
    }
  }

  // Check ground
  const gHits = raycaster.intersectObject(ground);
  if (gHits.length > 0) {
    target = { x: gHits[0].point.x, z: gHits[0].point.z };
    return;
  }
});

// ══════════════ NPC CLICK ══════════════
renderer.domElement.addEventListener('click', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const npcMeshes = npcs.map(n => n.children[0]);
  const hits = raycaster.intersectObjects(npcMeshes);
  if (hits.length > 0) {
    const idx = npcs.findIndex(n => n.children[0] === hits[0].object);
    const dialogs = [
      ["欢迎！☕ 今天的豆子是埃塞俄比亚的。","圣水洞以前全是工厂，现在变成艺术家和咖啡师的乐园了。","往东一直走，有一条小巷子……尽头的墙上开满了花。"],
      ["大林仓库以前真的堆满了货物！","我喜欢这里——旧的砖墙和新的艺术混在一起。","三个主要地点都逛过了吗？去东边巷子看看？"]
    ];
    const d = dialogs[idx] || ["你好！"];
    const msg = d[Math.floor(Math.random()*d.length)];
    // Show dialog as a floating text near the NPC
    showFloatingDialog(npcs[idx].position, msg);
  }
});

// Simple floating dialog
let dialogEl = null;
function showFloatingDialog(worldPos, text) {
  if (dialogEl) { dialogEl.remove(); dialogEl = null; }
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(255,253,245,0.92);backdrop-filter:blur(12px);border:1.5px solid #E0D5C5;border-radius:16px;padding:14px 20px;max-width:300px;font-family:Nunito,sans-serif;font-size:14px;color:#4A3728;pointer-events:auto;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,0.08);z-index:50;text-align:center;line-height:1.5;`;
  el.textContent = text + ' (点击关闭)';
  el.addEventListener('click', () => { el.remove(); dialogEl = null; });
  document.body.appendChild(el);
  dialogEl = el;
}

// ══════════════ ANIMATION LOOP ══════════════
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // Player movement
  if (target) {
    const dx = target.x - player.position.x;
    const dz = target.z - player.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < 0.3) { target = null; player.position.y = 0; }
    else {
      const speed = 4.5 * dt;
      player.position.x += (dx/dist) * speed;
      player.position.z += (dz/dist) * speed;
      player.position.y = Math.abs(Math.sin(Date.now()*0.013)) * 0.08;
      player.rotation.y = Math.atan2(dx, dz);
    }
  }

  // Trees gently sway
  scene.children.forEach(c => {
    if (c.geometry?.type === 'SphereGeometry' && c.position.y > 1) {
      c.position.x += Math.sin(Date.now()*0.002 + c.position.z) * 0.0003;
    }
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -size*a; camera.right = size*a;
  camera.top = size; camera.bottom = -size;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
